<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
  }
  main { width: 100%; max-width: 420px; }
  .settings { display: grid; gap: 20px; }
  .actions { display: flex; align-items: center; gap: 12px; }
  #status { font-size: 14px; color: var(--sb-color-muted-foreground); }
</style>
</head>
<body>
<main>
  <form id="settings">
    <sb-card>
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-checkbox name="email" label="Email" description="Receive updates about your account by email." checked></sb-checkbox>
          <sb-checkbox name="push" label="Push" description="Get alerts on your devices as they happen."></sb-checkbox>
          <sb-checkbox name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-checkbox>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <div class="actions">
          <sb-button type="submit">Save</sb-button>
          <span id="status" role="status"></span>
        </div>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
<script src="sketchbook.js"></script>
<script>
  document.getElementById('settings').addEventListener('submit', function (e) {
    e.preventDefault();
    var on = Array.from(new FormData(e.target).keys());
    document.getElementById('status').textContent = 'Saved (' + (on.join(', ') || 'none') + ')';
  });
</script>
</body>
</html>
