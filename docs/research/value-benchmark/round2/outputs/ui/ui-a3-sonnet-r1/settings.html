<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
  }
  sb-card { width: 100%; max-width: 420px; }
  form { display: contents; }
  .settings { display: grid; gap: 1.25rem; }
  .status { margin: 0; font-size: 0.875rem; color: var(--sb-color-muted-foreground); }
</style>
</head>
<body>
<main>
  <sb-card>
    <form id="settings" aria-labelledby="title">
      <sb-card-header>
        <sb-card-title id="title">Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-switch name="email" label="Email" description="Receive updates and account activity by email." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday."></sb-switch>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" id="status" role="status"></p>
      </sb-card-footer>
    </form>
  </sb-card>
</main>
<script src="sketchbook.js"></script>
<script>
  document.getElementById('settings').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = new FormData(e.target);
    var on = ['email', 'push', 'digest'].filter(function (k) { return data.has(k); });
    document.getElementById('status').textContent =
      'Saved. On: ' + (on.length ? on.join(', ') : 'none') + '.';
  });
</script>
</body>
</html>
