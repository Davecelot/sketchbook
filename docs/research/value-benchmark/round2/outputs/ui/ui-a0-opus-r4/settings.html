<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #d9dce1;
    --text: #1a1d23;
    --muted: #555b66;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --track-off: #8a909b;
    --thumb: #ffffff;
    --focus: #2457d6;
    --success: #1d7a3e;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #1a1d23;
      --border: #2e333c;
      --text: #eceef2;
      --muted: #a4abb7;
      --accent: #7aa2ff;
      --accent-text: #0f1115;
      --track-off: #5c636f;
      --thumb: #ffffff;
      --focus: #9bb9ff;
      --success: #6fd394;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .card-header { padding: 1.25rem 1.5rem .25rem; }
  .card-header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .card-header p { margin: .25rem 0 0; color: var(--muted); font-size: .9375rem; }

  fieldset { border: 0; margin: 0; padding: 0 1.5rem; }
  legend {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .setting {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border);
  }
  .setting:last-child { border-bottom: 0; }
  .setting-text label { font-weight: 500; cursor: pointer; }
  .setting-text p { margin: .125rem 0 0; color: var(--muted); font-size: .875rem; }

  /* Native checkbox styled as a switch: keeps Space toggling, Tab order and form submission. */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 2.75rem;
    height: 1.5rem;
    margin: .125rem 0 0;
    border-radius: 999px;
    background: var(--track-off);
    cursor: pointer;
    transition: background-color .15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc(1.5rem - 6px);
    height: calc(1.5rem - 6px);
    border-radius: 50%;
    background: var(--thumb);
    box-shadow: 0 1px 2px rgb(0 0 0 / .3);
    transition: transform .15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(1.25rem); }
  .switch:focus-visible,
  .button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1rem;
    padding: 1rem 1.5rem 1.25rem;
    border-top: 1px solid var(--border);
  }
  .status { margin: 0 auto 0 0; color: var(--success); font-size: .875rem; }
  .button {
    font: inherit;
    font-weight: 600;
    padding: .5rem 1.25rem;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .button:hover { filter: brightness(1.08); }
  .button:active { filter: brightness(.95); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }

  /* Windows High Contrast / forced colors: keep the switch state visible. */
  @media (forced-colors: active) {
    .switch { border: 1px solid CanvasText; background: Canvas; }
    .switch::before { background: CanvasText; box-shadow: none; }
    .switch:checked { background: Highlight; }
    .switch:checked::before { background: HighlightText; }
    .button { border-color: ButtonText; }
  }
</style>
</head>
<body>
<main class="card">
  <form id="notification-settings" action="#" method="post" aria-labelledby="settings-title" novalidate>
    <header class="card-header">
      <h1 id="settings-title">Notification settings</h1>
      <p>Choose how you'd like to hear from us.</p>
    </header>

    <fieldset>
      <legend>Notification channels</legend>

      <div class="setting">
        <div class="setting-text">
          <label for="notify-email">Email</label>
          <p id="notify-email-desc">Get account activity and important updates in your inbox.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="notify-email" name="email"
               aria-describedby="notify-email-desc" checked>
      </div>

      <div class="setting">
        <div class="setting-text">
          <label for="notify-push">Push</label>
          <p id="notify-push-desc">Receive real-time alerts on your devices.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="notify-push" name="push"
               aria-describedby="notify-push-desc">
      </div>

      <div class="setting">
        <div class="setting-text">
          <label for="notify-digest">Weekly digest</label>
          <p id="notify-digest-desc">A summary of the week's highlights, sent every Monday.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="notify-digest" name="digest"
               aria-describedby="notify-digest-desc">
      </div>
    </fieldset>

    <footer class="card-footer">
      <p class="status" id="save-status" role="status" aria-live="polite"></p>
      <button class="button" type="submit">Save</button>
    </footer>
  </form>
</main>

<script>
  (function () {
    var form = document.getElementById('notification-settings');
    var status = document.getElementById('save-status');
    var timer;

    // Clear a stale "saved" message as soon as something changes.
    form.addEventListener('change', function () { status.textContent = ''; });

    form.addEventListener('submit', function (event) {
      // No backend when opened from disk; replace with a real request when wiring up.
      event.preventDefault();
      var data = {};
      form.querySelectorAll('input[type="checkbox"]').forEach(function (input) {
        data[input.name] = input.checked;
      });
      console.log('Saved notification settings:', data);

      clearTimeout(timer);
      status.textContent = '';
      // Re-set on next frame so screen readers re-announce on repeated saves.
      requestAnimationFrame(function () {
        status.textContent = 'Settings saved.';
        timer = setTimeout(function () { status.textContent = ''; }, 4000);
      });
    });
  })();
</script>
</body>
</html>
