<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #1a1d23;
      --text-muted: #5b6270;
      --border: #d9dce1;
      --track-off: #8a909c;
      --accent: #2456d6;
      --accent-hover: #1c46b3;
      --on-accent: #ffffff;
      --thumb: #ffffff;
      --focus: #2456d6;
      --success: #1a7f45;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 4px 16px rgb(0 0 0 / 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #1a1d23;
        --text: #eceef2;
        --text-muted: #a3a9b5;
        --border: #343944;
        --track-off: #6b7280;
        --accent: #6c93ff;
        --accent-hover: #8aa9ff;
        --on-accent: #0f1115;
        --thumb: #ffffff;
        --focus: #8aa9ff;
        --success: #5fd08f;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.3);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 32rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .card-header { padding: 1.25rem 1.5rem 0.25rem; }
    .card-header h1 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
    .card-header p { margin: 0.25rem 0 0; color: var(--text-muted); font-size: 0.9375rem; }

    fieldset { border: 0; margin: 0; padding: 0 1.5rem; }
    legend {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .setting:last-child { border-bottom: 0; }
    .setting-text { min-width: 0; }
    .setting-text label { display: block; font-weight: 600; cursor: pointer; }
    .setting-text p { margin: 0.125rem 0 0; color: var(--text-muted); font-size: 0.875rem; }

    /* Switch: a native checkbox with role="switch", restyled */
    .switch {
      appearance: none;
      -webkit-appearance: none;
      flex-shrink: 0;
      position: relative;
      width: 2.75rem;
      height: 1.5rem;
      margin: 0;
      border-radius: 999px;
      background: var(--track-off);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc(1.5rem - 6px);
      height: calc(1.5rem - 6px);
      border-radius: 50%;
      background: var(--thumb);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      transition: transform 0.15s ease;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::before { transform: translateX(1.25rem); }
    .switch:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
    }
    .status { margin: 0; margin-right: auto; color: var(--success); font-size: 0.875rem; }

    .button {
      font: inherit;
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }
    .button:hover { background: var(--accent-hover); }
    .button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::before { transition: none; }
    }

    /* Windows High Contrast / forced colors: keep the switch state visible */
    @media (forced-colors: active) {
      .switch { border: 1px solid CanvasText; background: Canvas; }
      .switch::before { background: CanvasText; forced-color-adjust: none; }
      .switch:checked { background: Highlight; }
      .switch:checked::before { background: HighlightText; }
    }
  </style>
</head>
<body>
  <main class="card">
    <form id="notification-settings" novalidate>
      <header class="card-header">
        <h1 id="settings-title">Notification settings</h1>
        <p>Choose how you'd like to hear from us.</p>
      </header>

      <fieldset aria-labelledby="settings-title">
        <legend>Notification channels</legend>

        <div class="setting">
          <div class="setting-text">
            <label for="notify-email">Email</label>
            <p id="notify-email-desc">Get account activity and updates in your inbox.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="notify-email"
                 name="email" aria-describedby="notify-email-desc" checked>
        </div>

        <div class="setting">
          <div class="setting-text">
            <label for="notify-push">Push</label>
            <p id="notify-push-desc">Receive real-time alerts on your devices.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="notify-push"
                 name="push" aria-describedby="notify-push-desc">
        </div>

        <div class="setting">
          <div class="setting-text">
            <label for="notify-digest">Weekly digest</label>
            <p id="notify-digest-desc">A summary of the week's highlights, sent every Monday.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="notify-digest"
                 name="digest" aria-describedby="notify-digest-desc">
        </div>
      </fieldset>

      <footer class="card-footer">
        <p class="status" id="save-status" role="status" aria-live="polite"></p>
        <button class="button" type="submit">Save</button>
      </footer>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById("notification-settings");
      var status = document.getElementById("save-status");
      var clearTimer;

      // Native checkboxes toggle with Space; also let Enter toggle a focused switch,
      // matching the WAI-ARIA switch pattern, instead of submitting the form.
      form.addEventListener("keydown", function (e) {
        var t = e.target;
        if (e.key === "Enter" && t.matches && t.matches('input[role="switch"]')) {
          e.preventDefault();
          t.click();
        }
      });

      // Clear a stale "Saved" message once the user changes something.
      form.addEventListener("change", function () {
        status.textContent = "";
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault(); // No backend: the page runs from disk.
        var data = new FormData(form);
        var settings = {
          email: data.has("email"),
          push: data.has("push"),
          digest: data.has("digest")
        };
        console.log("Saved notification settings:", settings);

        status.textContent = "Settings saved.";
        clearTimeout(clearTimer);
        clearTimer = setTimeout(function () { status.textContent = ""; }, 4000);
      });
    })();
  </script>
</body>
</html>
