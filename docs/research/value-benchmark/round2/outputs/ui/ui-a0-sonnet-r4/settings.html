<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1b1e24;
    --muted: #5a6270;
    --border: #d5d9e0;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --track-off: #6b7380;
    --focus: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1e2126;
      --text: #eceef2;
      --muted: #a3abb8;
      --border: #3a3f48;
      --accent: #6c93ff;
      --accent-text: #0d1117;
      --track-off: #8a93a1;
      --focus: #9bb4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  h1 { margin: 0 0 1rem; font-size: 1.25rem; }
  fieldset { border: 0; margin: 0; padding: 0; }
  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.875rem 0;
    border-top: 1px solid var(--border);
  }
  .setting label { flex: 1; cursor: pointer; }
  .name { display: block; font-weight: 600; }
  .desc { display: block; color: var(--muted); font-size: 0.875rem; }
  .switch { position: relative; flex: none; width: 3rem; height: 1.75rem; }
  .switch input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: var(--track-off);
    transition: background .15s;
    pointer-events: none;
  }
  .track::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: calc(1.75rem - 6px); height: calc(1.75rem - 6px);
    border-radius: 50%;
    background: #fff;
    transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(1.25rem); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions {
    display: flex; align-items: center; gap: 1rem;
    padding-top: 1rem; border-top: 1px solid var(--border);
  }
  button {
    font: inherit; font-weight: 600;
    padding: 0.5rem 1.25rem;
    border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #status { color: var(--muted); font-size: 0.875rem; }
  @media (prefers-reduced-motion: reduce) {
    .track, .track::after { transition: none; }
  }
</style>
</head>
<body>
<main>
<form class="card" id="form" aria-labelledby="title">
  <h1 id="title">Notification settings</h1>
  <fieldset>
    <legend class="visually-hidden" style="position:absolute;left:-9999px">Notification channels</legend>

    <div class="setting">
      <label for="email">
        <span class="name">Email</span>
        <span class="desc" id="email-d">Get important updates and account activity in your inbox.</span>
      </label>
      <span class="switch">
        <input type="checkbox" role="switch" id="email" name="email" checked aria-describedby="email-d">
        <span class="track" aria-hidden="true"></span>
      </span>
    </div>

    <div class="setting">
      <label for="push">
        <span class="name">Push</span>
        <span class="desc" id="push-d">Receive instant alerts on your device.</span>
      </label>
      <span class="switch">
        <input type="checkbox" role="switch" id="push" name="push" aria-describedby="push-d">
        <span class="track" aria-hidden="true"></span>
      </span>
    </div>

    <div class="setting">
      <label for="digest">
        <span class="name">Weekly digest</span>
        <span class="desc" id="digest-d">A summary of the week's activity, sent once a week.</span>
      </label>
      <span class="switch">
        <input type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-d">
        <span class="track" aria-hidden="true"></span>
      </span>
    </div>
  </fieldset>

  <div class="actions">
    <button type="submit">Save</button>
    <span id="status" role="status"></span>
  </div>
</form>
</main>
<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var s = ['email', 'push', 'digest'].map(function (k) { return k + ': ' + (f[k].checked ? 'on' : 'off'); });
    document.getElementById('status').textContent = 'Saved (' + s.join(', ') + ')';
  });
</script>
</body>
</html>
