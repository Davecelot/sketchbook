<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: system-ui, sans-serif;
    }
    sb-card { width: min(100%, 420px); }
    form { display: contents; }
    .settings { display: grid; gap: 1.25rem; }
    #status { margin: 0 0 0 0.75rem; font-size: 0.875rem; color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <main>
    <sb-card>
      <form id="settings" aria-labelledby="title">
        <sb-card-header>
          <sb-card-title id="title">Notification settings</sb-card-title>
          <sb-card-description>Choose how you want to hear from us.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <div class="settings">
            <sb-switch name="email" checked label="Email" description="Receive account activity and updates by email."></sb-switch>
            <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
          </div>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <p id="status" role="status"></p>
        </sb-card-footer>
      </form>
    </sb-card>
  </main>
  <script src="sketchbook.js"></script>
  <script>
    document.getElementById('settings').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const on = ['email', 'push', 'digest'].filter((name) => data.has(name));
      document.getElementById('status').textContent = 'Saved. On: ' + (on.join(', ') || 'none') + '.';
    });
  </script>
</body>
</html>
