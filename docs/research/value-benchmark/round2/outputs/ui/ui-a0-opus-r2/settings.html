<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --border: #d9dce1;
      --text: #1b1e23;
      --text-muted: #5b616b;
      --accent: #2557d6;
      --accent-hover: #1d47b3;
      --on-accent: #ffffff;
      --track-off: #8a909a;
      --thumb: #ffffff;
      --focus: #2557d6;
      --success: #1d7a3e;
      --radius: 12px;
      --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --surface: #1b1e24;
        --border: #343943;
        --text: #eceef1;
        --text-muted: #a3a9b3;
        --accent: #7aa2ff;
        --accent-hover: #9bb8ff;
        --on-accent: #0c1630;
        --track-off: #6b717c;
        --thumb: #ffffff;
        --focus: #9bb8ff;
        --success: #6fd394;
        --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card h1 { margin: 0 0 4px; font-size: 1.25rem; line-height: 1.3; }
    .card > p { margin: 0 0 16px; color: var(--text-muted); font-size: .9375rem; }

    fieldset { border: 0; margin: 0; padding: 0; }
    legend {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
      cursor: pointer;
    }
    .setting:last-child { border-bottom: 1px solid var(--border); }
    .setting-text { display: grid; gap: 2px; }
    .setting-name { font-weight: 600; }
    .setting-desc { color: var(--text-muted); font-size: .875rem; }

    /* Switch: a native checkbox with role="switch", restyled */
    .switch {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      position: relative;
      width: 44px;
      height: 24px;
      margin: 0;
      border-radius: 999px;
      background: var(--track-off);
      cursor: pointer;
      transition: background-color .15s ease;
    }
    .switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--thumb);
      box-shadow: 0 1px 2px rgb(0 0 0 / .3);
      transition: transform .15s ease;
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::before { transform: translateX(20px); }
    .switch:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }
    .status { margin: 0; font-size: .875rem; color: var(--success); }

    button {
      font: inherit;
      font-weight: 600;
      padding: 8px 20px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::before { transition: none; }
    }
    @media (forced-colors: active) {
      .switch { border: 1px solid CanvasText; }
      .switch::before { background: CanvasText; }
      .switch:checked { background: Highlight; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">Notification settings</h1>
    <p>Choose how you'd like to hear from us.</p>

    <form id="settings-form">
      <fieldset>
        <legend>Notification channels</legend>

        <label class="setting" for="email">
          <span class="setting-text">
            <span class="setting-name">Email</span>
            <span class="setting-desc" id="email-desc">Get account activity and updates in your inbox.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" id="email" name="email"
                 aria-describedby="email-desc" checked>
        </label>

        <label class="setting" for="push">
          <span class="setting-text">
            <span class="setting-name">Push</span>
            <span class="setting-desc" id="push-desc">Receive real-time alerts on your devices.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" id="push" name="push"
                 aria-describedby="push-desc">
        </label>

        <label class="setting" for="digest">
          <span class="setting-text">
            <span class="setting-name">Weekly digest</span>
            <span class="setting-desc" id="digest-desc">A summary of the week's highlights, every Monday.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" id="digest" name="digest"
                 aria-describedby="digest-desc">
        </label>
      </fieldset>

      <div class="actions">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <button type="submit">Save</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('settings-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      // No backend: in a real app, send this payload to the server.
      const settings = Object.fromEntries(
        [...form.querySelectorAll('.switch')].map((s) => [s.name, s.checked])
      );
      console.log('Saved settings', settings);
      status.textContent = 'Settings saved.';
    });

    // Clear the confirmation once anything changes again.
    form.addEventListener('change', () => { status.textContent = ''; });
  </script>
</body>
</html>
