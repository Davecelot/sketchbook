<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: system-ui, sans-serif;
    }
    form { width: min(100%, 420px); }
    sb-card-content { display: grid; gap: 24px; }
    #status { margin: 0; flex: 1; font-size: 14px; color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <form id="settings">
    <sb-card>
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <sb-switch name="email" label="Email" description="Receive updates and account activity in your inbox." checked></sb-switch>
        <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
        <sb-switch name="digest" label="Weekly digest" description="A summary of the week, delivered every Monday."></sb-switch>
      </sb-card-content>
      <sb-card-footer>
        <p id="status" role="status"></p>
        <sb-button type="submit">Save</sb-button>
      </sb-card-footer>
    </sb-card>
  </form>
  <script src="sketchbook.js"></script>
  <script>
    document.getElementById('settings').addEventListener('submit', (e) => {
      e.preventDefault();
      const on = [...new FormData(e.target).keys()];
      document.getElementById('status').textContent = 'Saved. On: ' + (on.length ? on.join(', ') : 'none') + '.';
    });
  </script>
</body>
</html>
