<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: system-ui, sans-serif;
  }
  main { width: 100%; max-width: 28rem; }
  h1 { font: inherit; margin: 0; }
  .settings { display: grid; gap: 1.25rem; }
  .status { margin: 0 0 0 0.75rem; font-size: 0.875rem; color: var(--sb-color-muted-foreground); }
</style>
</head>
<body>
<main>
  <form id="settings" aria-labelledby="title">
    <sb-card>
      <sb-card-header>
        <sb-card-title><h1 id="title">Notification settings</h1></sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-switch name="email" label="Email" description="Receive updates about your account by email." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday."></sb-switch>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" role="status" id="status"></p>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
<script src="sketchbook.js"></script>
<script>
  const form = document.getElementById('settings');
  const status = document.getElementById('status');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = new FormData(form);
    const on = ['email', 'push', 'digest'].filter((k) => data.has(k));
    status.textContent = 'Saved. On: ' + (on.length ? on.join(', ') : 'none') + '.';
  });
  form.addEventListener('change', () => { status.textContent = ''; });
</script>
</body>
</html>
