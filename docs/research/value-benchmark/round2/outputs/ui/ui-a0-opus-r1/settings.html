<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #d9dde3;
    --text: #1b1f24;
    --text-muted: #57606a;
    --accent: #2457d6;
    --accent-hover: #1c46ad;
    --on-accent: #ffffff;
    --track-off: #8a929c;
    --thumb: #ffffff;
    --focus: #2457d6;
    --success: #1a7f37;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #181c22;
      --border: #2f3640;
      --text: #e8ebef;
      --text-muted: #a2abb6;
      --accent: #6d9bff;
      --accent-hover: #8fb2ff;
      --on-accent: #0b1220;
      --track-off: #5c6672;
      --thumb: #f2f4f7;
      --focus: #8fb2ff;
      --success: #4ac26b;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-header { padding: 20px 24px 4px; }
  .card-header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .card-header p { margin: 4px 0 0; color: var(--text-muted); }

  fieldset { border: 0; margin: 0; padding: 8px 24px; }
  legend {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .setting:first-of-type { border-top: 0; }
  .setting-text { display: flex; flex-direction: column; }
  .setting-title { font-weight: 600; }
  .setting-desc { color: var(--text-muted); font-size: .9rem; }

  /* Switch: a native checkbox restyled, so Space toggles and forms submit it */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 44px;
    height: 24px;
    margin: 0;
    border-radius: 999px;
    background: var(--track-off);
    cursor: pointer;
    transition: background-color .15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--thumb);
    box-shadow: 0 1px 2px rgb(0 0 0 / .3);
    transition: transform .15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(20px); }
  .switch:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }
  @media (forced-colors: active) {
    .switch { border: 1px solid CanvasText; background: Canvas; }
    .switch::before { background: CanvasText; }
    .switch:checked { background: Highlight; }
  }
  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .status { color: var(--success); font-size: .9rem; margin-right: auto; }

  .button {
    font: inherit;
    font-weight: 600;
    padding: 8px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
  }
  .button:hover { background: var(--accent-hover); }
  .button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <form id="settings-form">
    <header class="card-header">
      <h1 id="title">Notification settings</h1>
      <p>Choose how you'd like to hear from us.</p>
    </header>

    <fieldset>
      <legend>Notification channels</legend>

      <label class="setting" for="email">
        <span class="setting-text">
          <span class="setting-title">Email</span>
          <span class="setting-desc" id="email-desc">Get updates about your account activity by email.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
      </label>

      <label class="setting" for="push">
        <span class="setting-text">
          <span class="setting-title">Push</span>
          <span class="setting-desc" id="push-desc">Receive instant alerts on your devices.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
      </label>

      <label class="setting" for="digest">
        <span class="setting-text">
          <span class="setting-title">Weekly digest</span>
          <span class="setting-desc" id="digest-desc">A summary of the week's highlights, every Monday.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
      </label>
    </fieldset>

    <footer class="card-footer">
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button class="button" type="submit">Save</button>
    </footer>
  </form>
</main>

<script>
  const form = document.getElementById('settings-form');
  const status = document.getElementById('status');
  let clearTimer;

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const data = new FormData(form);
    const settings = {
      email: data.has('email'),
      push: data.has('push'),
      digest: data.has('digest'),
    };
    console.log('Saved settings', settings);
    status.textContent = 'Settings saved.';
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { status.textContent = ''; }, 4000);
  });

  // Clear a stale "saved" message once something changes.
  form.addEventListener('change', () => { status.textContent = ''; });
</script>
</body>
</html>
