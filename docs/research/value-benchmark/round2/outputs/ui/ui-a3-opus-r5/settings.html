<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification settings</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <!-- Classic IIFE bundle, not a module: file:// pages can't load ES modules. -->
  <script src="assets/sketchbook.js"></script>
  <style>
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    body {
      margin: 0;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-body);
    }

    main {
      max-inline-size: 36rem;
      margin-inline: auto;
      padding: var(--sb-space-inset-surface);
    }

    sb-card-title h1 {
      margin: 0;
      font: inherit;
    }

    sb-card-content {
      display: grid;
      gap: var(--sb-space-stack-lg);
    }

    sb-card-footer {
      justify-content: flex-end;
      gap: var(--sb-space-stack-md);
    }

    #status {
      margin: 0;
      color: var(--sb-color-muted-foreground);
    }
  </style>
</head>
<body>
  <main>
    <form id="notifications" aria-labelledby="notifications-title">
      <sb-card>
        <sb-card-header>
          <sb-card-title><h1 id="notifications-title">Notification settings</h1></sb-card-title>
          <sb-card-description>Choose how we keep you informed. Changes apply after you save.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <sb-switch name="email" label="Email" description="Account activity and replies sent to your inbox." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Alerts on your devices as things happen."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A short recap of the week, every Monday."></sb-switch>
        </sb-card-content>
        <sb-card-footer>
          <p id="status" role="status"></p>
          <sb-button type="submit">Save</sb-button>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>
  <script>
    const form = document.getElementById('notifications');
    const status = document.getElementById('status');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const on = [...new FormData(form).keys()].length;
      status.textContent = `Saved. ${on} of 3 notifications on.`;
    });
    form.addEventListener('change', () => { status.textContent = ''; });
  </script>
</body>
</html>
