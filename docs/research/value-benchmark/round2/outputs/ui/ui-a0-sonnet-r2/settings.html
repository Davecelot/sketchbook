<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5a6270;
    --border: #d9dde3;
    --track: #6b7280;
    --accent: #1d5fd1;
    --on-accent: #ffffff;
    --focus: #1d5fd1;
    --ok: #17663a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --surface: #1a1d23;
      --text: #eceef2;
      --muted: #a0a8b5;
      --border: #333843;
      --track: #8a93a1;
      --accent: #6ea0ff;
      --on-accent: #0b1220;
      --focus: #9bbcff;
      --ok: #6fd69a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .lead { margin: 0 0 1rem; color: var(--muted); font-size: .9375rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; }
  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .875rem 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .setting .name { display: block; font-weight: 600; }
  .setting .desc { display: block; color: var(--muted); font-size: .875rem; }

  /* Switch built on a real checkbox: keyboard + screen reader support is native */
  .switch { position: relative; flex: none; width: 2.75rem; height: 1.5rem; }
  .switch input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .switch .track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: transparent;
    border: 2px solid var(--track);
    transition: background .15s, border-color .15s;
    pointer-events: none;
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 50%; left: 3px;
    width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%;
    background: var(--track);
    transition: transform .15s, background .15s;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { background: var(--on-accent); transform: translateX(1.25rem); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }

  .actions { display: flex; align-items: center; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  button {
    font: inherit; font-weight: 600;
    padding: .5rem 1.25rem;
    border-radius: 8px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #status { color: var(--ok); font-size: .875rem; }

  @media (forced-colors: active) {
    .switch .track { border-color: CanvasText; }
    .switch .track::after { background: CanvasText; }
    .switch input:checked + .track { background: Highlight; border-color: Highlight; }
    .switch input:checked + .track::after { background: HighlightText; }
  }
  @media (prefers-reduced-motion: reduce) {
    .switch .track, .switch .track::after { transition: none; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="form" aria-labelledby="title">
    <h1 id="title">Notification settings</h1>
    <p class="lead">Choose how we keep you up to date.</p>

    <fieldset>
      <legend class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Notification channels</legend>

      <label class="setting">
        <span>
          <span class="name">Email</span>
          <span class="desc" id="d-email">Get important updates and account activity in your inbox.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="email" aria-describedby="d-email" checked>
          <span class="track"></span>
        </span>
      </label>

      <label class="setting">
        <span>
          <span class="name">Push</span>
          <span class="desc" id="d-push">Receive instant alerts on your device.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="push" aria-describedby="d-push">
          <span class="track"></span>
        </span>
      </label>

      <label class="setting">
        <span>
          <span class="name">Weekly digest</span>
          <span class="desc" id="d-digest">A once-a-week summary of what you missed.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="digest" aria-describedby="d-digest">
          <span class="track"></span>
        </span>
      </label>
    </fieldset>

    <div class="actions">
      <button type="submit">Save</button>
      <span id="status" role="status"></span>
    </div>
  </form>
</main>
<script>
  var form = document.getElementById('form');
  var status = document.getElementById('status');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = 'Settings saved.';
  });
  form.addEventListener('change', function () { status.textContent = ''; });
</script>
</body>
</html>
