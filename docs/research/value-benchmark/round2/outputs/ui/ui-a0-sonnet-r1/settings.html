<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #596070;
    --border: #d5d9e0;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --track-off: #6b7385;
    --thumb: #ffffff;
    --focus: #2457d6;
    --ok: #1d6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319;
      --surface: #1a1e27;
      --text: #eceef3;
      --muted: #a3abbb;
      --border: #333a48;
      --accent: #6f98ff;
      --accent-text: #0b1020;
      --track-off: #7d869a;
      --thumb: #ffffff;
      --focus: #9bb8ff;
      --ok: #6fd391;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.25rem; line-height: 1.3; }
  .lead { margin: 0 0 1rem; color: var(--muted); font-size: .9375rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .875rem 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .text { display: block; }
  .name { display: block; font-weight: 600; }
  .desc { display: block; color: var(--muted); font-size: .875rem; }

  /* Switch: real checkbox, visually restyled, fully keyboard operable */
  .switch { position: relative; flex: none; width: 2.75rem; height: 1.5rem; }
  .switch input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: var(--track-off);
    transition: background .15s;
    pointer-events: none;
  }
  .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: calc(1.5rem - 4px); height: calc(1.5rem - 4px);
    border-radius: 50%;
    background: var(--thumb);
    transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(1.25rem); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 3px; }
  .row:has(input:focus-visible) { outline: none; }

  .actions { display: flex; align-items: center; gap: 1rem; margin-top: .5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  button {
    font: inherit; font-weight: 600;
    padding: .5rem 1.25rem;
    border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  #status { color: var(--ok); font-size: .875rem; }

  @media (prefers-reduced-motion: reduce) {
    .track, .track::after { transition: none; }
  }
  @media (forced-colors: active) {
    .track { border: 1px solid CanvasText; background: Canvas; }
    .track::after { background: CanvasText; }
    .switch input:checked + .track { background: Highlight; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="form" aria-labelledby="title">
    <h1 id="title">Notification settings</h1>
    <p class="lead">Choose how we keep you up to date.</p>

    <fieldset>
      <legend class="sr-only" style="position:absolute;left:-9999px">Notification channels</legend>

      <label class="row">
        <span class="text">
          <span class="name" id="n-email">Email</span>
          <span class="desc" id="d-email">Get important updates and alerts in your inbox.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="email" checked aria-labelledby="n-email" aria-describedby="d-email">
          <span class="track"></span>
        </span>
      </label>

      <label class="row">
        <span class="text">
          <span class="name" id="n-push">Push</span>
          <span class="desc" id="d-push">Receive instant notifications on your devices.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="push" aria-labelledby="n-push" aria-describedby="d-push">
          <span class="track"></span>
        </span>
      </label>

      <label class="row">
        <span class="text">
          <span class="name" id="n-digest">Weekly digest</span>
          <span class="desc" id="d-digest">A summary of the week's activity, once a week.</span>
        </span>
        <span class="switch">
          <input type="checkbox" role="switch" name="digest" aria-labelledby="n-digest" aria-describedby="d-digest">
          <span class="track"></span>
        </span>
      </label>
    </fieldset>

    <div class="actions">
      <button type="submit">Save</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </form>
</main>
<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var s = document.getElementById('status');
    s.textContent = '';
    // Re-set on next frame so repeated saves are announced again.
    requestAnimationFrame(function () { s.textContent = 'Settings saved.'; });
  });
</script>
</body>
</html>
