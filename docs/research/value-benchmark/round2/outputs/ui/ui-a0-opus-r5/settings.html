<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #d7dae0;
    --text: #1b1f24;
    --text-muted: #59616d;
    --accent: #2f5fd0;
    --accent-hover: #244cad;
    --accent-text: #ffffff;
    --track-off: #8a929e;
    --thumb: #ffffff;
    --focus: #2f5fd0;
    --success: #1d7a46;
    --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418;
      --surface: #1c1f25;
      --border: #343944;
      --text: #e8eaee;
      --text-muted: #a3aab5;
      --accent: #7aa2ff;
      --accent-hover: #9bb9ff;
      --accent-text: #0d1220;
      --track-off: #6b7280;
      --thumb: #f2f4f7;
      --focus: #9bb9ff;
      --success: #5fd394;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121418;
    --surface: #1c1f25;
    --border: #343944;
    --text: #e8eaee;
    --text-muted: #a3aab5;
    --accent: #7aa2ff;
    --accent-hover: #9bb9ff;
    --accent-text: #0d1220;
    --track-off: #6b7280;
    --thumb: #f2f4f7;
    --focus: #9bb9ff;
    --success: #5fd394;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .3);
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-header { padding: 20px 24px 4px; }
  .card-header h1 { margin: 0; font-size: 1.25rem; line-height: 1.3; }
  .card-header p { margin: 4px 0 0; color: var(--text-muted); font-size: .9rem; }

  fieldset { border: 0; margin: 0; padding: 0 24px; }
  legend {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .setting:first-of-type { border-top: 0; }
  .setting-text { min-width: 0; }
  .setting-text label { font-weight: 600; cursor: pointer; }
  .setting-text p { margin: 2px 0 0; color: var(--text-muted); font-size: .875rem; }

  /* Switch: native checkbox, exposed as a switch */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 44px;
    height: 24px;
    margin: 0;
    border-radius: 999px;
    background: var(--track-off);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color .15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--thumb);
    box-shadow: 0 1px 2px rgb(0 0 0 / .3);
    transition: transform .15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(20px); }
  .switch:focus-visible,
  .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 16px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .status { margin: 0 auto 0 0; color: var(--success); font-size: .875rem; }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }
  @media (forced-colors: active) {
    .switch { border-color: CanvasText; background: Canvas; }
    .switch::before { background: CanvasText; box-shadow: none; }
    .switch:checked { background: Highlight; border-color: Highlight; }
    .switch:checked::before { background: HighlightText; }
    .btn { border-color: ButtonText; }
  }
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <form id="notifications" novalidate>
    <header class="card-header">
      <h1 id="title">Notification settings</h1>
      <p>Choose how you'd like to hear from us.</p>
    </header>

    <fieldset>
      <legend>Notification channels</legend>

      <div class="setting">
        <div class="setting-text">
          <label for="email">Email</label>
          <p id="email-desc">Get account activity and updates in your inbox.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="email" name="email"
               aria-describedby="email-desc" checked>
      </div>

      <div class="setting">
        <div class="setting-text">
          <label for="push">Push</label>
          <p id="push-desc">Receive real-time alerts on your devices.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="push" name="push"
               aria-describedby="push-desc">
      </div>

      <div class="setting">
        <div class="setting-text">
          <label for="digest">Weekly digest</label>
          <p id="digest-desc">A summary of the week's highlights, every Monday.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="digest" name="digest"
               aria-describedby="digest-desc">
      </div>
    </fieldset>

    <footer class="card-footer">
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button class="btn" type="submit">Save</button>
    </footer>
  </form>
</main>

<script>
  const form = document.getElementById('notifications');
  const status = document.getElementById('status');

  // Native checkboxes toggle with Space; also allow Enter on a switch, as users expect.
  form.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('.switch')) {
      e.preventDefault();
      e.target.click();
    }
  });

  form.addEventListener('change', () => { status.textContent = ''; });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const on = ['email', 'push', 'digest']
      .filter((name) => form.elements[name].checked)
      .map((name) => form.querySelector(`label[for="${name}"]`).textContent);
    status.textContent = on.length
      ? `Saved. On: ${on.join(', ')}.`
      : 'Saved. All notifications off.';
  });
</script>
</body>
</html>
