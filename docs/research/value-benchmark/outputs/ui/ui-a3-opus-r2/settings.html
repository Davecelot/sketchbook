<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--sb-space-6);
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
    font-size: var(--sb-font-size-body);
    line-height: var(--sb-font-line-height-body);
  }

  .card {
    width: 100%;
    max-width: 28rem;
    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    border: var(--sb-border-width-default) solid var(--sb-color-border);
    border-radius: var(--sb-radius-surface);
    box-shadow: var(--sb-elevation-sm);
    padding: var(--sb-space-inset-surface);
  }

  h1 {
    margin: 0;
    font-size: var(--sb-font-size-heading-4);
    line-height: var(--sb-font-line-height-heading-4);
    font-weight: var(--sb-font-weight-heading);
    letter-spacing: var(--sb-font-letter-spacing-heading);
  }

  .lead {
    margin: var(--sb-space-stack-tight) 0 0;
    color: var(--sb-color-muted-foreground);
    font-size: var(--sb-font-size-sm);
  }

  .settings { margin-top: var(--sb-space-stack-lg); }

  .setting {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sb-space-4);
    padding: var(--sb-space-stack-loose) 0;
    border-top: var(--sb-border-width-default) solid var(--sb-color-border);
  }
  .setting:last-child { border-bottom: var(--sb-border-width-default) solid var(--sb-color-border); }

  .setting label {
    display: block;
    font-size: var(--sb-font-size-sm);
    font-weight: var(--sb-font-weight-label);
    line-height: var(--sb-font-line-height-label);
    cursor: pointer;
  }

  .setting p {
    margin: var(--sb-space-stack-2xs) 0 0;
    color: var(--sb-color-muted-foreground);
    font-size: var(--sb-font-size-sm);
  }

  .switch {
    appearance: none;
    flex: none;
    margin: 0;
    position: relative;
    width: var(--sb-size-switch-width);
    height: var(--sb-size-switch-height);
    border-radius: var(--sb-radius-pill);
    border: var(--sb-border-width-default) solid var(--sb-color-input);
    background: var(--sb-color-input-background);
    cursor: pointer;
    transition: background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }
  .switch::before {
    content: "";
    position: absolute;
    top: var(--sb-space-switch-inset);
    left: var(--sb-space-switch-inset);
    width: calc(var(--sb-size-switch-height) - 2 * var(--sb-space-switch-inset) - 2 * var(--sb-border-width-default));
    aspect-ratio: 1;
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-input);
    transition: transform var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }
  .switch:checked {
    background: var(--sb-color-primary);
    border-color: var(--sb-color-primary);
  }
  .switch:checked::before {
    background: var(--sb-color-primary-foreground);
    transform: translateX(calc(var(--sb-size-switch-width) - var(--sb-size-switch-height)));
  }
  .switch:focus-visible,
  .button:focus-visible {
    outline: var(--sb-focus-ring-width) solid var(--sb-color-ring);
    outline-offset: var(--sb-focus-ring-offset);
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--sb-space-3);
    margin-top: var(--sb-space-stack-lg);
  }

  .status {
    margin: 0;
    color: var(--sb-color-muted-foreground);
    font-size: var(--sb-font-size-sm);
  }

  .button {
    height: var(--sb-size-control-default);
    padding: 0 var(--sb-space-control-padding-x-default);
    border: 0;
    border-radius: var(--sb-radius-control);
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
    font: inherit;
    font-size: var(--sb-font-size-control);
    font-weight: var(--sb-font-weight-control);
    cursor: pointer;
  }
  .button:hover { opacity: var(--sb-opacity-90); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }

  /* appearance: none drops the system rendering, so forced-colors mode needs explicit system colors to show state */
  @media (forced-colors: active) {
    .switch { border-color: CanvasText; background: Canvas; }
    .switch::before { background: CanvasText; }
    .switch:checked { background: Highlight; border-color: Highlight; }
    .switch:checked::before { background: HighlightText; }
  }
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <h1 id="title">Notification settings</h1>
  <p class="lead">Choose how you want to hear from us.</p>

  <form id="settings">
    <div class="settings">

      <div class="setting">
        <div>
          <label for="email">Email</label>
          <p id="email-desc">Receive updates and alerts in your inbox.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
      </div>

      <div class="setting">
        <div>
          <label for="push">Push</label>
          <p id="push-desc">Get instant notifications on your devices.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
      </div>

      <div class="setting">
        <div>
          <label for="digest">Weekly digest</label>
          <p id="digest-desc">A summary of your activity, every Monday.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
      </div>
    </div>

    <div class="actions">
      <p class="status" id="status" role="status"></p>
      <button class="button" type="submit">Save</button>
    </div>
  </form>
</main>

<script>
  const form = document.getElementById('settings');
  const status = document.getElementById('status');
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const on = [...form.querySelectorAll('.switch')].filter((s) => s.checked).map((s) => s.labels[0].textContent);
    status.textContent = `Saved. ${on.length ? on.join(', ') + ' on' : 'All notifications off'}.`;
  });
  form.addEventListener('change', () => { status.textContent = ''; });
</script>
</body>
</html>
