<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--sb-space-6);
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
    font-size: var(--sb-font-size-body);
    line-height: var(--sb-font-line-height-body);
  }

  .card {
    width: 100%;
    /* sketchbook-allow-literal: card width, no layout-width token exists */
    max-width: 28rem;
    margin: 0;
    padding: var(--sb-space-inset-surface);
    border: var(--sb-border-width-default) solid var(--sb-color-border);
    border-radius: var(--sb-radius-surface);
    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    box-shadow: var(--sb-elevation-sm);
  }

  h1 {
    margin: 0;
    font-size: var(--sb-font-size-heading-4);
    line-height: var(--sb-font-line-height-heading-4);
    font-weight: var(--sb-font-weight-heading);
    letter-spacing: var(--sb-font-letter-spacing-heading);
  }

  .lead {
    margin: var(--sb-space-1) 0 0;
    color: var(--sb-color-muted-foreground);
  }

  .settings { margin-top: var(--sb-space-stack-lg); }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sb-space-4);
    padding-block: var(--sb-space-stack-md);
  }

  .setting + .setting { border-top: var(--sb-border-width-default) solid var(--sb-color-border); }

  .setting label {
    display: block;
    font-weight: var(--sb-font-weight-label);
    cursor: pointer;
  }

  .setting p {
    margin: var(--sb-space-1) 0 0;
    color: var(--sb-color-muted-foreground);
  }

  .switch {
    appearance: none;
    flex: none;
    position: relative;
    margin: 0;
    width: var(--sb-size-36);
    height: var(--sb-size-20);
    border: var(--sb-border-width-default) solid transparent;
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-input);
    cursor: pointer;
    transition: background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  .switch::before {
    content: "";
    position: absolute;
    inset-block: var(--sb-space-switch-inset);
    inset-inline-start: var(--sb-space-switch-inset);
    aspect-ratio: 1;
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-background);
    transition: translate var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  .switch:checked { background: var(--sb-color-primary); }
  .switch:checked::before { translate: calc(var(--sb-size-36) - var(--sb-size-20)) 0; }

  .switch:focus-visible,
  .button:focus-visible {
    outline: var(--sb-focus-ring-width) solid var(--sb-color-ring);
    outline-offset: var(--sb-focus-ring-offset);
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--sb-space-3);
    margin-top: var(--sb-space-stack-lg);
  }

  .status { margin: 0; color: var(--sb-color-muted-foreground); }

  .button {
    height: var(--sb-size-36);
    padding-inline: var(--sb-space-control-padding-x-default);
    border: 0;
    border-radius: var(--sb-radius-control);
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
    font: inherit;
    font-size: var(--sb-font-size-control);
    font-weight: var(--sb-font-weight-control);
    cursor: pointer;
  }

  .button:hover { opacity: var(--sb-opacity-90); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }

  /* appearance:none drops the system rendering, so the track and thumb need explicit system colors */
  @media (forced-colors: active) {
    .switch { border-color: CanvasText; }
    .switch::before { background: CanvasText; }
    .switch:checked { background: Highlight; }
    .switch:checked::before { background: HighlightText; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="notifications" aria-labelledby="title">
    <h1 id="title">Notification settings</h1>
    <p class="lead">Choose how you want to hear from us.</p>

    <div class="settings">

      <div class="setting">
        <div>
          <label for="email">Email</label>
          <p id="email-desc">Receive account activity and updates by email.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
      </div>

      <div class="setting">
        <div>
          <label for="push">Push</label>
          <p id="push-desc">Get alerts on your devices as things happen.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
      </div>

      <div class="setting">
        <div>
          <label for="digest">Weekly digest</label>
          <p id="digest-desc">A summary of the week, every Monday morning.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
      </div>
    </div>

    <div class="actions">
      <p class="status" id="status" role="status"></p>
      <button class="button" type="submit">Save</button>
    </div>
  </form>
</main>

<script>
  const form = document.getElementById('notifications');
  const status = document.getElementById('status');

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const on = [...new FormData(form).keys()]
      .map((name) => document.querySelector(`label[for="${name}"]`).textContent);
    status.textContent = `Saved. ${on.length ? `On: ${on.join(', ')}.` : 'All notifications off.'}`;
  });

  form.addEventListener('change', () => { status.textContent = ''; });
</script>
</body>
</html>
