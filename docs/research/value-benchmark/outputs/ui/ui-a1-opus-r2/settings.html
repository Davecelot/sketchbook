<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<!-- Design-system tokens (light, dark, prefers-color-scheme); regenerate with `npm run generate`, never edit. -->
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--sb-space-6);
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
    font-size: var(--sb-font-size-body);
    line-height: var(--sb-font-line-height-body);
  }

  .theme-toggle {
    position: fixed;
    top: var(--sb-space-4);
    right: var(--sb-space-4);
  }

  .card {
    width: 100%;
    max-width: 28rem;
    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    border: var(--sb-border-width-default) solid var(--sb-color-border);
    border-radius: var(--sb-radius-large);
    box-shadow: var(--sb-elevation-sm);
    padding: var(--sb-space-inset-surface);
    display: grid;
    gap: var(--sb-space-stack-lg);
  }

  .card-header { display: grid; gap: var(--sb-space-stack-xs); }

  h1 {
    margin: 0;
    font-size: var(--sb-font-size-heading);
    font-weight: var(--sb-font-weight-heading);
    line-height: var(--sb-font-line-height-heading);
    letter-spacing: var(--sb-font-letter-spacing-heading);
  }

  .muted { margin: 0; color: var(--sb-color-muted-foreground); }

  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: var(--sb-space-stack-loose); }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sb-space-4);
  }

  .setting-text { display: grid; gap: var(--sb-space-stack-xs); }

  .setting label {
    font-weight: var(--sb-font-weight-label);
    line-height: var(--sb-font-line-height-label);
    cursor: pointer;
  }

  .setting .muted { font-size: var(--sb-font-size-body); }

  input[role="switch"] {
    appearance: none;
    flex: none;
    margin: 0;
    width: var(--sb-size-switch-width);
    height: var(--sb-size-switch-height);
    padding: var(--sb-space-switch-inset);
    border: 0;
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-input);
    cursor: pointer;
    transition: background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  input[role="switch"]::before {
    content: "";
    display: block;
    height: 100%;
    aspect-ratio: 1;
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-background);
    transition: transform var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  input[role="switch"]:checked { background: var(--sb-color-primary); }

  input[role="switch"]:checked::before {
    transform: translateX(calc(var(--sb-size-switch-width) - var(--sb-size-switch-height)));
  }

  button {
    font: inherit;
    font-size: var(--sb-font-size-control);
    font-weight: var(--sb-font-weight-control);
    line-height: var(--sb-font-line-height-control);
    min-height: var(--sb-size-control-default);
    padding: 0 var(--sb-space-control-padding-x-default);
    border-radius: var(--sb-radius-control);
    border: var(--sb-border-width-default) solid transparent;
    cursor: pointer;
  }

  .primary {
    justify-self: start;
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
  }

  .outline {
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    border-color: var(--sb-color-border);
  }

  form { display: grid; gap: var(--sb-space-stack-lg); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }

  .actions { display: flex; align-items: center; gap: var(--sb-space-4); }

  :is(input, button):focus-visible {
    outline: none;
    box-shadow: 0 0 0 var(--sb-focus-ring-width) var(--sb-color-ring);
  }

  @media (forced-colors: active) {
    input[role="switch"] { border: var(--sb-border-width-default) solid CanvasText; }
    input[role="switch"]::before { background: CanvasText; }
    input[role="switch"]:checked { background: Highlight; }
    input[role="switch"]:checked::before { background: HighlightText; }
    :is(input, button):focus-visible { outline: var(--sb-focus-ring-width) solid CanvasText; }
  }

  @media (prefers-reduced-motion: reduce) {
    input[role="switch"], input[role="switch"]::before { transition: none; }
  }
</style>
</head>
<body>
  <button type="button" class="outline theme-toggle" id="theme-toggle" aria-pressed="false">Dark theme</button>

  <main class="card" aria-labelledby="title">
    <header class="card-header">
      <h1 id="title">Notification settings</h1>
      <p class="muted">Choose how we keep you informed.</p>
    </header>

    <form id="settings">
      <fieldset>
        <legend class="sr-only">Notifications</legend>

        <div class="setting">
          <div class="setting-text">
            <label for="email">Email</label>
            <p class="muted" id="email-desc">Account activity and replies sent to your inbox.</p>
          </div>
          <input type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
        </div>

        <div class="setting">
          <div class="setting-text">
            <label for="push">Push</label>
            <p class="muted" id="push-desc">Instant alerts on your devices.</p>
          </div>
          <input type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
        </div>

        <div class="setting">
          <div class="setting-text">
            <label for="digest">Weekly digest</label>
            <p class="muted" id="digest-desc">A summary of the week, every Monday.</p>
          </div>
          <input type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary">Save</button>
        <p class="muted" id="status" role="status"></p>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("settings");
    const status = document.getElementById("status");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const on = ["email", "push", "digest"]
        .filter((name) => form.elements[name].checked)
        .map((name) => document.querySelector(`label[for="${name}"]`).textContent);
      status.textContent = on.length ? `Saved. On: ${on.join(", ")}.` : "Saved. All notifications off.";
    });

    form.addEventListener("change", () => { status.textContent = ""; });

    const toggle = document.getElementById("theme-toggle");
    const root = document.documentElement;
    const isDark = () => (root.dataset.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
    const render = () => toggle.setAttribute("aria-pressed", String(isDark()));
    toggle.addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      render();
    });
    render();
  </script>
</body>
</html>
