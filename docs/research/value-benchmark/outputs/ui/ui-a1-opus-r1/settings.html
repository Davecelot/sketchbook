<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="../generated/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: var(--sb-space-10) var(--sb-space-4);
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-body);
      font-size: var(--sb-font-size-body);
      line-height: var(--sb-font-line-height-body);
    }

    .card {
      width: 100%;
      max-width: 32rem;
      margin: 0;
      padding: var(--sb-space-inset-surface);
      background: var(--sb-color-card);
      color: var(--sb-color-card-foreground);
      border: var(--sb-border-width-default) solid var(--sb-color-border);
      border-radius: var(--sb-radius-surface);
      box-shadow: var(--sb-elevation-sm);
    }

    .card h1 {
      margin: 0;
      font-size: var(--sb-font-size-heading-4);
      line-height: var(--sb-font-line-height-heading-4);
      font-weight: var(--sb-font-weight-heading);
      letter-spacing: var(--sb-font-letter-spacing-heading);
    }

    .card > p {
      margin: var(--sb-space-1-5) 0 0;
      font-size: var(--sb-font-size-sm);
      color: var(--sb-color-muted-foreground);
    }

    .settings { margin-top: var(--sb-space-6); }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sb-space-4);
      padding: var(--sb-space-4) 0;
      border-top: var(--sb-border-width-default) solid var(--sb-color-border);
    }

    .setting label {
      display: block;
      font-size: var(--sb-font-size-sm);
      font-weight: var(--sb-font-weight-label);
      line-height: var(--sb-font-line-height-label);
      cursor: pointer;
    }

    .setting p {
      margin: var(--sb-space-1) 0 0;
      font-size: var(--sb-font-size-sm);
      color: var(--sb-color-muted-foreground);
    }

    .switch {
      appearance: none;
      flex: none;
      position: relative;
      width: var(--sb-size-32);
      height: var(--sb-size-20);
      margin: 0;
      border: 0;
      border-radius: var(--sb-radius-pill);
      background: var(--sb-color-input);
      cursor: pointer;
      transition: background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
    }

    .switch::before {
      content: "";
      position: absolute;
      inset-block-start: var(--sb-space-0-5);
      inset-inline-start: var(--sb-space-0-5);
      width: var(--sb-size-16);
      height: var(--sb-size-16);
      border-radius: var(--sb-radius-full);
      background: var(--sb-color-background);
      transition: translate var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
    }

    .switch:checked { background: var(--sb-color-primary); }
    .switch:checked::before { translate: var(--sb-size-12) 0; }

    .switch:focus-visible,
    .button:focus-visible {
      outline: var(--sb-focus-ring-width) solid var(--sb-color-ring);
      outline-offset: var(--sb-focus-ring-offset);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--sb-space-3);
      padding-top: var(--sb-space-4);
      border-top: var(--sb-border-width-default) solid var(--sb-color-border);
    }

    .status {
      font-size: var(--sb-font-size-sm);
      color: var(--sb-color-muted-foreground);
    }

    .button {
      height: var(--sb-size-control-default);
      padding: 0 var(--sb-space-control-padding-x-default);
      border: 0;
      border-radius: var(--sb-radius-control);
      background: var(--sb-color-primary);
      color: var(--sb-color-primary-foreground);
      font: inherit;
      font-size: var(--sb-font-size-control);
      font-weight: var(--sb-font-weight-control);
      cursor: pointer;
    }

    .button:hover { opacity: 0.9; }

    @media (prefers-reduced-motion: reduce) {
      .switch, .switch::before { transition: none; }
    }

    /* Windows High Contrast drops backgrounds; keep the track and thumb visible. */
    @media (forced-colors: active) {
      .switch { outline: var(--sb-border-width-default) solid CanvasText; }
      .switch::before { background: CanvasText; }
      .switch:checked { background: Highlight; }
    }
  </style>
</head>
<body>
  <main>
    <form class="card" id="notification-settings" aria-labelledby="settings-title">
      <h1 id="settings-title">Notification settings</h1>
      <p>Choose how we keep you up to date.</p>

      <div class="settings">

        <div class="setting">
          <div>
            <label for="email">Email</label>
            <p id="email-desc">Get account activity and updates by email.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
        </div>

        <div class="setting">
          <div>
            <label for="push">Push</label>
            <p id="push-desc">Receive alerts on your devices in real time.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
        </div>

        <div class="setting">
          <div>
            <label for="digest">Weekly digest</label>
            <p id="digest-desc">A summary of the week, every Monday.</p>
          </div>
          <input class="switch" type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
        </div>
      </div>

      <div class="actions">
        <span class="status" id="status" role="status"></span>
        <button class="button" type="submit">Save</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('notification-settings');
    const status = document.getElementById('status');

    form.addEventListener('change', () => { status.textContent = ''; });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const on = [...new FormData(form).keys()].length;
      status.textContent = `Saved. ${on} of 3 notifications on.`;
    });
  </script>
</body>
</html>
