<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--sb-space-6);
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-sans);
    font-size: var(--sb-font-size-sm);
    line-height: var(--sb-font-line-height-sm);
  }

  .card {
    width: 100%;
    max-width: 28rem;
    padding: var(--sb-space-inset-surface);
    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    border: var(--sb-border-width-1) solid var(--sb-color-border);
    border-radius: var(--sb-radius-large);
    box-shadow: var(--sb-shadow-sm);
  }

  h1 {
    margin: 0;
    font-size: var(--sb-font-size-lg);
    line-height: var(--sb-font-line-height-lg);
    font-weight: var(--sb-font-weight-semibold);
  }

  .lede {
    margin: var(--sb-space-1) 0 0;
    color: var(--sb-color-muted-foreground);
  }

  fieldset {
    margin: var(--sb-space-6) 0 0;
    padding: 0;
    border: 0;
    display: grid;
    gap: var(--sb-space-field-gap);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sb-space-4);
    padding: var(--sb-space-inset-md);
    border: var(--sb-border-width-1) solid var(--sb-color-border);
    border-radius: var(--sb-radius-control);
  }

  .text { display: grid; gap: var(--sb-space-0-5); }

  .name {
    font-weight: var(--sb-font-weight-medium);
    cursor: pointer;
  }

  .desc {
    margin: 0;
    color: var(--sb-color-muted-foreground);
    font-size: var(--sb-font-size-xs);
    line-height: var(--sb-font-line-height-xs);
  }

  .switch {
    appearance: none;
    flex: none;
    position: relative;
    width: var(--sb-space-8);
    height: var(--sb-space-5);
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: var(--sb-radius-pill);
    background: var(--sb-color-input);
    cursor: pointer;
    transition: background-color var(--sb-duration-150) var(--sb-easing-standard);
  }

  .switch::before {
    content: "";
    position: absolute;
    top: var(--sb-space-0-5);
    left: var(--sb-space-0-5);
    width: var(--sb-space-4);
    height: var(--sb-space-4);
    border-radius: var(--sb-radius-pill);
    background: var(--sb-color-background);
    transition: transform var(--sb-duration-150) var(--sb-easing-standard);
  }

  .switch:checked { background: var(--sb-color-primary); }
  .switch:checked::before {
    transform: translateX(var(--sb-space-3));
    background: var(--sb-color-primary-foreground);
  }

  .switch:focus-visible {
    outline: var(--sb-border-width-2) solid var(--sb-color-ring);
    outline-offset: var(--sb-border-width-2);
  }

  .switch:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (forced-colors: active) {
    .switch { border: var(--sb-border-width-1) solid ButtonText; }
    .switch:checked { background: Highlight; }
    .switch::before { background: ButtonText; }
    .switch:checked::before { background: HighlightText; }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: var(--sb-space-3);
    margin-top: var(--sb-space-6);
  }

  .save {
    padding: var(--sb-space-2) var(--sb-space-control-padding-x-default);
    border: 0;
    border-radius: var(--sb-radius-control);
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
    font: inherit;
    font-weight: var(--sb-font-weight-medium);
    cursor: pointer;
  }

  .save:hover { opacity: 0.9; }
  .save:focus-visible {
    outline: var(--sb-border-width-2) solid var(--sb-color-ring);
    outline-offset: var(--sb-border-width-2);
  }

  .status { color: var(--sb-color-muted-foreground); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="settings" aria-labelledby="title">
    <h1 id="title">Notification settings</h1>
    <p class="lede" id="lede">Choose how you want to hear from us.</p>

    <fieldset aria-describedby="lede">
      <legend class="sr-only">Notification channels</legend>

      <div class="row">
        <div class="text">
          <label class="name" for="email">Email</label>
          <p class="desc" id="email-desc">Receive updates and account activity in your inbox.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="email" name="email" aria-describedby="email-desc" checked>
      </div>

      <div class="row">
        <div class="text">
          <label class="name" for="push">Push</label>
          <p class="desc" id="push-desc">Get instant alerts on your phone or browser.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
      </div>

      <div class="row">
        <div class="text">
          <label class="name" for="digest">Weekly digest</label>
          <p class="desc" id="digest-desc">A summary of the week, sent every Monday.</p>
        </div>
        <input class="switch" type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
      </div>
    </fieldset>

    <div class="actions">
      <button class="save" type="submit">Save</button>
      <span class="status" role="status" id="status"></span>
    </div>
  </form>
</main>
<script>
  document.getElementById("settings").addEventListener("submit", (event) => {
    event.preventDefault();
    const data = new FormData(event.currentTarget);
    const on = ["email", "push", "digest"].filter((key) => data.has(key));
    document.getElementById("status").textContent =
      "Saved. On: " + (on.length ? on.join(", ") : "none") + ".";
  });
</script>
</body>
</html>
