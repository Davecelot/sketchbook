<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #d9dce1;
    --text: #1b1f24;
    --text-muted: #59616c;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --track-off: #8a929c;
    --thumb: #ffffff;
    --focus: #2457d6;
    --success: #1d7a3e;
    --radius: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #1a1e24;
      --border: #333a44;
      --text: #e8eaed;
      --text-muted: #a3abb6;
      --accent: #7aa2ff;
      --accent-text: #0b1530;
      --track-off: #6b7480;
      --thumb: #0f1216;
      --focus: #9bbaff;
      --success: #6fd394;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .card h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .card > p { margin: 0 0 16px; color: var(--text-muted); font-size: 0.925rem; }

  fieldset { border: 0; margin: 0; padding: 0; }
  legend {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .setting:last-child { border-bottom: 1px solid var(--border); }
  .setting-text { display: flex; flex-direction: column; gap: 2px; }
  .setting-name { font-weight: 600; }
  .setting-desc { color: var(--text-muted); font-size: 0.875rem; }

  /* Switch: a native checkbox with role="switch", restyled */
  .switch {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    position: relative;
    width: 44px;
    height: 24px;
    margin: 0;
    border-radius: 999px;
    background: var(--track-off);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--thumb);
    transition: transform 0.15s ease;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(20px); }
  .switch:focus-visible,
  .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .status { color: var(--success); font-size: 0.875rem; }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::before { transition: none; }
  }
  @media (forced-colors: active) {
    .switch { border: 1px solid CanvasText; }
    .switch::before { background: CanvasText; }
    .switch:checked { background: Highlight; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1 id="title">Notification settings</h1>
    <p>Choose how you'd like to hear from us.</p>

    <form id="settings-form" aria-labelledby="title">
      <fieldset>
        <legend>Notification channels</legend>

        <label class="setting">
          <span class="setting-text">
            <span class="setting-name">Email</span>
            <span class="setting-desc" id="email-desc">Get account activity and updates in your inbox.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" name="email" checked aria-describedby="email-desc">
        </label>

        <label class="setting">
          <span class="setting-text">
            <span class="setting-name">Push</span>
            <span class="setting-desc" id="push-desc">Receive real-time alerts on your devices.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" name="push" aria-describedby="push-desc">
        </label>

        <label class="setting">
          <span class="setting-text">
            <span class="setting-name">Weekly digest</span>
            <span class="setting-desc" id="digest-desc">A summary of the week, sent every Monday.</span>
          </span>
          <input class="switch" type="checkbox" role="switch" name="digest" aria-describedby="digest-desc">
        </label>
      </fieldset>

      <div class="actions">
        <button class="btn" type="submit">Save</button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </main>

<script>
  const form = document.getElementById('settings-form');
  const status = document.getElementById('status');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    status.textContent = 'Settings saved.';
  });
  form.addEventListener('change', () => { status.textContent = ''; });
</script>
</body>
</html>
