<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) { html:not([data-theme]) { color-scheme: dark; } }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
  }
  main {
    display: grid;
    justify-items: center;
    gap: var(--sb-space-4, 1rem);
    padding: var(--sb-space-16, 4rem) var(--sb-space-4, 1rem);
  }
  .toolbar, form { width: 100%; max-width: 28rem; }
  .toolbar { display: flex; justify-content: flex-end; }
  form { margin: 0; }
  sb-card { width: 100%; }
  sb-field-group { display: grid; gap: var(--sb-space-6, 1.5rem); }
  sb-card-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--sb-space-4, 1rem); }
  .status { margin: 0; font-size: var(--sb-font-size-sm, 0.875rem); color: var(--sb-color-muted-foreground); }
</style>
</head>
<body>
  <main>
    <div class="toolbar">
      <sb-button id="theme-toggle" variant="outline" size="sm">Dark theme</sb-button>
    </div>
    <form id="notification-form" aria-labelledby="settings-title">
      <sb-card>
        <sb-card-header>
          <sb-card-title id="settings-title" role="heading" aria-level="1">Notification settings</sb-card-title>
          <sb-card-description>Choose how and when we contact you.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <sb-field-group>
            <sb-switch name="email" label="Email" description="Get account activity and updates in your inbox." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Receive instant alerts on your devices."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
          </sb-field-group>
        </sb-card-content>
        <sb-card-footer>
          <p class="status" id="save-status" role="status"></p>
          <sb-button type="submit">Save</sb-button>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>

  grid-template-columns: auto minmax(0, 1fr);
  column-gap: var(--sb-switch-gap);
  row-gap: var(--sb-switch-content-gap);
  align-items: start;
  font-family: var(--sb-switch-font-family);
}

[part=control] {
  position: relative;
  display: inline-flex;
  grid-column: 1;
  grid-row: 1;
  margin-block: calc((var(--sb-switch-label-font-size) * var(--sb-switch-label-line-height) - var(--_height)) / 2);
}

[part=input] {
  appearance: none;
  box-sizing: border-box;
  width: var(--_width);
  height: var(--_height);
  margin: 0;
  border: var(--sb-switch-border-width) solid var(--sb-switch-border);
  border-radius: var(--sb-switch-radius);
  background: var(--sb-switch-track-bg);
  box-shadow: var(--sb-switch-shadow);
  cursor: pointer;
  transition-property: background-color, border-color, box-shadow;
  transition-duration: var(--sb-switch-transition-duration);
  transition-timing-function: var(--sb-switch-transition-easing);
}
@media (prefers-reduced-motion: reduce) {
  [part=input] {
    transition: none;
    animation: none;
  }
}
[part=input]:checked {
  border-color: var(--sb-switch-checked-bg);
  background: var(--sb-switch-checked-bg);
}
[part=input]:focus-visible {
  border-color: var(--sb-switch-focus-ring-color);
  outline: none;
  box-shadow: 0 0 0 var(--sb-switch-focus-ring-width) var(--sb-switch-focus-ring-color);
}
@media (forced-colors: active) {
  [part=input]:focus-visible {
    outline: var(--sb-switch-focus-ring-width) solid CanvasText;
  }
}
[part=input][aria-invalid=true] {
  border-color: var(--sb-switch-border-invalid);
}
[part=input][aria-invalid=true]:focus-visible {
  outline: none;
  box-shadow: 0 0 0 var(--sb-switch-focus-ring-width) color-mix(in oklab, var(--sb-switch-border-invalid) 20%, transparent);
}
@media (forced-colors: active) {
  [part=input][aria-invalid=true]:focus-visible {
    outline: var(--sb-switch-focus-ring-width) solid CanvasText;
  }
}
[part=input]:disabled {
  opacity: var(--sb-switch-disabled-opacity);
  cursor: not-allowed;
}
[part=input]:checked ~ [part=thumb] {
  transform: translateX(calc(var(--_width) - var(--_thumb) - 2 * var(--sb-switch-inset)));
  background: var(--sb-switch-thumb-checked-bg);
}
[part=input]:disabled ~ [part=thumb] {
  opacity: var(--sb-switch-disabled-opacity);
}

[part=thumb] {
  position: absolute;
  top: calc((var(--_height) - var(--_thumb)) / 2);
  left: var(--sb-switch-inset);
  width: var(--_thumb);
  height: var(--_thumb);
  border-radius: var(--sb-switch-radius);
  background: var(--sb-switch-thumb-bg);
  pointer-events: none;
  transition: transform var(--sb-switch-transition-duration) var(--sb-switch-transition-easing);
}
@media (prefers-reduced-motion: reduce) {
  [part=thumb] {
    transition: none;
    animation: none;
  }
}

[part=label] {
  grid-column: 2;
  grid-row: 1;
  color: var(--sb-switch-label-fg);
  font-size: var(--sb-switch-label-font-size);
  font-weight: var(--sb-switch-label-font-weight);
  line-height: var(--sb-switch-label-line-height);
  cursor: pointer;
}

:host(:disabled) [part=label] {
  opacity: var(--sb-switch-disabled-opacity);
  cursor: not-allowed;
}

:host([hide-label]) [part=label] {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

[part=description],
[part=error] {
  grid-column: 2;
  margin: 0;
  font-size: var(--sb-switch-description-font-size);
  line-height: var(--sb-switch-description-line-height);
}

[part=description] {
  grid-row: 2;
  color: var(--sb-switch-description-fg);
}

[part=error] {
  grid-row: auto;
  color: var(--sb-switch-error-fg);
}

[part=error]:empty {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

<script>
(function () {
  var root = document.documentElement;
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  var toggle = document.getElementById('theme-toggle');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : media.matches;
  }
  function sync() {
    toggle.textContent = isDark() ? 'Light theme' : 'Dark theme';
  }
  toggle.addEventListener('click', function () {
    root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    sync();
  });
  media.addEventListener('change', sync);
  sync();

  var form = document.getElementById('notification-form');
  var status = document.getElementById('save-status');
  var names = { email: 'Email', push: 'Push', digest: 'Weekly digest' };
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var data = new FormData(form);
    var on = Object.keys(names).filter(function (k) { return data.has(k); }).map(function (k) { return names[k]; });
    status.textContent = 'Saved. ' + (on.length ? 'On: ' + on.join(', ') + '.' : 'All notifications off.');
  });
  form.addEventListener('change', function () { status.textContent = ''; });
})();
</script>
