<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: var(--sb-space-4);
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
    font-size: var(--sb-font-size-body);
    line-height: var(--sb-font-line-height-body);
  }

  .card {
    width: 100%;
    max-width: 28rem;
    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    border: var(--sb-border-width-default) solid var(--sb-color-border);
    border-radius: var(--sb-radius-surface);
    box-shadow: var(--sb-elevation-sm);
    padding: var(--sb-space-6);
    display: grid;
    gap: var(--sb-space-6);
  }

  h1 {
    margin: 0;
    font-size: var(--sb-font-size-heading-lg);
    line-height: var(--sb-font-line-height-heading-lg);
    font-weight: var(--sb-font-weight-heading);
    letter-spacing: var(--sb-font-letter-spacing-heading);
  }

  .lead, .desc {
    margin: 0;
    color: var(--sb-color-muted-foreground);
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .header { display: grid; gap: var(--sb-space-1-5); }

  fieldset {
    margin: 0;
    padding: 0;
    border: 0;
    min-width: 0;
    display: grid;
  }

  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sb-space-4);
    padding: var(--sb-space-4) 0;
    border-top: var(--sb-border-width-default) solid var(--sb-color-border);
    cursor: pointer;
  }

  .text { display: grid; gap: var(--sb-space-1); }

  .name {
    font-weight: var(--sb-font-weight-label);
    font-size: var(--sb-font-size-control);
  }

  .desc { font-size: var(--sb-font-size-caption); line-height: var(--sb-font-line-height-caption); }

  .switch {
    --_track-h: var(--sb-size-switch-height);
    --_thumb: calc(var(--_track-h) - 2 * var(--sb-space-0-5));
    appearance: none;
    flex: none;
    position: relative;
    margin: 0;
    width: var(--sb-size-switch-width);
    height: var(--_track-h);
    border-radius: var(--sb-radius-pill);
    background: var(--sb-color-input);
    border: var(--sb-border-width-none) solid transparent;
    cursor: pointer;
    transition: background var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  .switch::after {
    content: "";
    position: absolute;
    top: var(--sb-space-0-5);
    left: var(--sb-space-0-5);
    width: var(--_thumb);
    height: var(--_thumb);
    border-radius: var(--sb-radius-full);
    background: var(--sb-color-background);
    transition: transform var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }

  .switch:checked { background: var(--sb-color-primary); }
  .switch:checked::after {
    transform: translateX(calc(var(--sb-size-switch-width) - var(--_track-h)));
    background: var(--sb-color-primary-foreground);
  }

  .switch:focus-visible {
    outline: var(--sb-focus-ring-width) solid var(--sb-color-ring);
    outline-offset: var(--sb-space-0-5);
  }

  .actions { display: flex; align-items: center; gap: var(--sb-space-3); flex-wrap: wrap; }

  .save {
    appearance: none;
    height: var(--sb-size-control-default);
    padding: 0 var(--sb-space-4);
    border: 0;
    border-radius: var(--sb-radius-control);
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
    font: inherit;
    font-size: var(--sb-font-size-control);
    font-weight: var(--sb-font-weight-control);
    cursor: pointer;
  }
  .save:hover { opacity: var(--sb-opacity-90); }
  .save:focus-visible {
    outline: var(--sb-focus-ring-width) solid var(--sb-color-ring);
    outline-offset: var(--sb-space-0-5);
  }

  .status { margin: 0; font-size: var(--sb-font-size-control); color: var(--sb-color-muted-foreground); }

  @media (prefers-reduced-motion: reduce) {
    .switch, .switch::after { transition: none; }
  }

  @media (forced-colors: active) {
    .switch { border: var(--sb-border-width-default) solid ButtonText; background: Canvas; }
    .switch::after { background: ButtonText; }
    .switch:checked { background: Highlight; border-color: Highlight; }
    .switch:checked::after { background: HighlightText; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="settings" aria-labelledby="title">
    <div class="header">
      <h1 id="title">Notification settings</h1>
      <p class="lead">Choose how you want to hear from us.</p>
    </div>

    <fieldset>
      <legend class="sr-only">Notification channels</legend>

      <label class="row">
        <span class="text">
          <span class="name" id="email-name">Email</span>
          <span class="desc" id="email-desc">Receive updates about your account by email.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="email" checked
               aria-labelledby="email-name" aria-describedby="email-desc">
      </label>

      <label class="row">
        <span class="text">
          <span class="name" id="push-name">Push</span>
          <span class="desc" id="push-desc">Get instant alerts on this device.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="push"
               aria-labelledby="push-name" aria-describedby="push-desc">
      </label>

      <label class="row">
        <span class="text">
          <span class="name" id="digest-name">Weekly digest</span>
          <span class="desc" id="digest-desc">A summary of the week, every Monday.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="digest"
               aria-labelledby="digest-name" aria-describedby="digest-desc">
      </label>
    </fieldset>

    <div class="actions">
      <button class="save" type="submit">Save</button>
      <p class="status" id="status" role="status"></p>
    </div>
  </form>
</main>

<script>
  document.getElementById('settings').addEventListener('submit', (e) => {
    e.preventDefault();
    const on = [...new FormData(e.target).keys()];
    document.getElementById('status').textContent =
      on.length ? 'Saved. Enabled: ' + on.join(', ') + '.' : 'Saved. All notifications are off.';
  });
</script>
</body>
</html>
