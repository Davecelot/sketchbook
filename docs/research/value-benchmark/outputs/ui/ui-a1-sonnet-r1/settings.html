    background: var(--sb-color-card);
    color: var(--sb-color-card-foreground);
    border: var(--sb-border-width-1) solid var(--sb-color-border);
    border-radius: var(--sb-radius-large);
    box-shadow: var(--sb-shadow-sm);
    padding: var(--sb-space-inset-surface);
  }
  h1 {
    margin: 0;
    font-size: var(--sb-font-size-heading-4);
    line-height: var(--sb-font-line-height-heading-4);
    font-weight: var(--sb-font-weight-heading);
    letter-spacing: var(--sb-font-letter-spacing-heading);
  }
  .lead { margin: var(--sb-space-1) 0 0; color: var(--sb-color-muted-foreground); }
  fieldset { border: 0; margin: var(--sb-space-6) 0 0; padding: 0; min-width: 0; }
  legend { padding: 0; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .setting {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--sb-space-4);
    padding: var(--sb-space-4) 0;
    border-top: var(--sb-border-width-1) solid var(--sb-color-border);
    cursor: pointer;
  }
  .text { display: grid; gap: var(--sb-space-1); }
  .name { font-weight: var(--sb-font-weight-label); }
  .desc { color: var(--sb-color-muted-foreground); font-size: var(--sb-font-size-caption); line-height: var(--sb-font-line-height-caption); }

  .switch {
    appearance: none;
    flex: none;
    margin: 0;
    position: relative;
    width: var(--sb-size-switch-width);
    height: var(--sb-size-switch-height);
    border-radius: var(--sb-radius-pill);
    border: var(--sb-border-width-2) solid var(--sb-color-input);
    background: var(--sb-color-input-background);
    cursor: pointer;
    transition: background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard),
                border-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 2px;
    width: 10px;
    height: 10px;
    margin-top: -5px;
    border-radius: var(--sb-radius-pill);
    background: var(--sb-color-input);
    transition: transform var(--sb-motion-duration-fast) var(--sb-motion-easing-standard),
                background-color var(--sb-motion-duration-fast) var(--sb-motion-easing-standard);
  }
  .switch:checked { background: var(--sb-color-primary); border-color: var(--sb-color-primary); }
  .switch:checked::after { transform: translateX(14px); background: var(--sb-color-primary-foreground); }
  .switch:focus-visible { outline: var(--sb-border-width-2) solid var(--sb-color-ring); outline-offset: var(--sb-border-width-2); }

  .actions { display: flex; justify-content: flex-end; align-items: center; gap: var(--sb-space-3); padding-top: var(--sb-space-4); border-top: var(--sb-border-width-1) solid var(--sb-color-border); }
  .status { margin-inline-end: auto; color: var(--sb-color-muted-foreground); font-size: var(--sb-font-size-caption); }
  .button {
    height: var(--sb-size-control-default);
    padding-inline: var(--sb-space-control-padding-x-default);
    border: 0;
    border-radius: var(--sb-radius-control);
    background: var(--sb-color-primary);
    color: var(--sb-color-primary-foreground);
    font: inherit;
    font-size: var(--sb-font-size-control);
    font-weight: var(--sb-font-weight-control);
    cursor: pointer;
  }
  .button:hover { filter: brightness(0.92); }
  .button:focus-visible { outline: var(--sb-border-width-2) solid var(--sb-color-ring); outline-offset: var(--sb-border-width-2); }

  @media (forced-colors: active) {
    .switch:checked { background: Highlight; border-color: Highlight; }
    .switch:checked::after { background: HighlightText; }
  }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Notification settings</h1>
  <p class="lead">Choose how you want to hear from us.</p>
  <form id="form" aria-labelledby="title">
    <fieldset>
      <legend>Notification channels</legend>
      <label class="setting">
        <span class="text">
          <span class="name" id="email-name">Email</span>
          <span class="desc" id="email-desc">Receive updates and alerts in your inbox.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="email" checked aria-labelledby="email-name" aria-describedby="email-desc">
      </label>
      <label class="setting">
        <span class="text">
          <span class="name" id="push-name">Push</span>
          <span class="desc" id="push-desc">Get instant alerts on your devices.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="push" aria-labelledby="push-name" aria-describedby="push-desc">
      </label>
      <label class="setting">
        <span class="text">
          <span class="name" id="digest-name">Weekly digest</span>
          <span class="desc" id="digest-desc">A summary of your activity, once a week.</span>
        </span>
        <input class="switch" type="checkbox" role="switch" name="digest" aria-labelledby="digest-name" aria-describedby="digest-desc">
      </label>
    </fieldset>
    <div class="actions">
      <span class="status" id="status" role="status"></span>
      <button class="button" type="submit">Save</button>
    </div>
  </form>
</main>
<script>
  var form = document.getElementById('form');
  var statusEl = document.getElementById('status');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var on = [];
    new FormData(form).forEach(function (_, k) { on.push(k); });
    statusEl.textContent = 'Saved. On: ' + (on.join(', ') || 'none') + '.';
  });
  form.addEventListener('change', function () { statusEl.textContent = ''; });
</script>
</body>
</html>
