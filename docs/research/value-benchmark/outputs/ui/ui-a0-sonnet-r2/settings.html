<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #d9dce3;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --track-off: #8a91a0;
    --thumb: #ffffff;
    --focus: #2457d6;
    --ok: #17673a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --text: #eceef2;
      --muted: #a2a9b8;
      --border: #333843;
      --accent: #6b94ff;
      --accent-text: #0b1020;
      --track-off: #6b7282;
      --thumb: #ffffff;
      --focus: #9db8ff;
      --ok: #62d08f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 30rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.25rem; line-height: 1.3; }
  .lead { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .875rem 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .text { display: flex; flex-direction: column; }
  .label { font-weight: 600; }
  .desc { color: var(--muted); font-size: .875rem; }

  /* Switch built on a native checkbox: keyboard + screen reader support for free */
  .switch { position: relative; flex: none; width: 2.75rem; height: 1.5rem; }
  .switch input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: pointer;
  }
  .track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: var(--track-off);
    transition: background .15s;
    pointer-events: none;
  }
  .track::after {
    content: "";
    position: absolute; top: 3px; left: 3px;
    width: calc(1.5rem - 6px); height: calc(1.5rem - 6px);
    border-radius: 50%;
    background: var(--thumb);
    transition: transform .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(1.25rem); }
  .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 2px; }

  .actions { display: flex; align-items: center; gap: 1rem; margin-top: .5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  button {
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 8px;
    padding: .55rem 1.25rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #status { color: var(--ok); font-size: .9rem; }

  @media (forced-colors: active) {
    .track { border: 1px solid CanvasText; }
    .switch input:checked + .track { background: Highlight; }
  }
  @media (prefers-reduced-motion: reduce) {
    .track, .track::after { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <form id="settings-form">
      <h1>Notification settings</h1>
      <p class="lead">Choose how you want to hear from us.</p>
      <fieldset>
        <legend>Notification channels</legend>

        <label class="row">
          <span class="text">
            <span class="label" id="email-l">Email</span>
            <span class="desc" id="email-d">Get important updates and alerts in your inbox.</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" name="email" checked aria-labelledby="email-l" aria-describedby="email-d">
            <span class="track"></span>
          </span>
        </label>

        <label class="row">
          <span class="text">
            <span class="label" id="push-l">Push</span>
            <span class="desc" id="push-d">Receive instant notifications on your devices.</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" name="push" aria-labelledby="push-l" aria-describedby="push-d">
            <span class="track"></span>
          </span>
        </label>

        <label class="row">
          <span class="text">
            <span class="label" id="digest-l">Weekly digest</span>
            <span class="desc" id="digest-d">A summary of the week's activity, every Monday.</span>
          </span>
          <span class="switch">
            <input type="checkbox" role="switch" name="digest" aria-labelledby="digest-l" aria-describedby="digest-d">
            <span class="track"></span>
          </span>
        </label>
      </fieldset>

      <div class="actions">
        <button type="submit">Save</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
<script>
  const form = document.getElementById('settings-form');
  const status = document.getElementById('status');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries([...form.querySelectorAll('input')].map(i => [i.name, i.checked]));
    try { localStorage.setItem('notification-settings', JSON.stringify(data)); } catch (_) {}
    status.textContent = 'Settings saved.';
  });
  form.addEventListener('change', () => { status.textContent = ''; });
  try {
    const saved = JSON.parse(localStorage.getItem('notification-settings'));
    if (saved) form.querySelectorAll('input').forEach(i => { if (i.name in saved) i.checked = !!saved[i.name]; });
  } catch (_) {}
</script>
</body>
</html>
