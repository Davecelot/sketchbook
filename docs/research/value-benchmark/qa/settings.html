<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification settings</title>
<link rel="stylesheet" href="../node_modules/sketchbook/generated/css/tokens.css">
<script src="../node_modules/sketchbook/dist/sketchbook.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: var(--sb-space-6); background: var(--sb-color-background); color: var(--sb-color-foreground); font-family: var(--sb-font-family-body); }
  main { width: 100%; max-width: 28rem; }
  .fields { display: grid; gap: var(--sb-space-17); }
  .hint { margin: 0; color: #d33; font-size: var(--sb-font-size-small); }
  .actions { display: flex; justify-content: flex-end; }
  .save { padding: var(--sb-space-2) var(--sb-space-4); border-radius: var(--sb-radius-control); background: var(--sb-color-primary); color: var(--sb-color-primary-foreground); border: 0; }
</style>
</head>
<body>
<main>
  <form>
    <sb-card>
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
      </sb-card-header>
      <sb-card-content>
        <div class="fields">
          <sb-switch name="email" label="Email" description="Get updates by email" tone="success" checked></sb-switch>
          <sb-switch name="push" description="Alerts on your phone"></sb-switch>
          <sb-toggle name="digest" label="Weekly digest" description="A summary every Monday"></sb-toggle>
        </div>
        <p class="hint">Changes apply after you save.</p>
      </sb-card-content>
      <sb-card-footer>
        <div class="actions"><button type="submit" class="save">Save</button></div>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
</body>
</html>
