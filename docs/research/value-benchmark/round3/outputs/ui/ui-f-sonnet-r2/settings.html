<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <!-- Design system: tokens + element bundle, copied into assets/ so the page opens from disk. Light/dark follows the OS. -->
  <link rel="stylesheet" href="assets/tokens.css">
  <script src="assets/sketchbook.js" defer></script>
  <style>
    html { background: var(--sb-color-background); color: var(--sb-color-foreground); }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 16px;
      box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main { width: 100%; max-width: 440px; }
    sb-card { width: 100%; }
    form { display: contents; }
    .switches { display: flex; flex-direction: column; gap: 24px; }
    #status { margin: 0; font-size: 14px; color: var(--sb-color-muted-foreground); }
    #status:empty { display: none; }
    sb-card-footer { align-items: center; gap: 16px; }
  </style>
</head>
<body>
  <main>
    <sb-card>
      <form id="settings" aria-labelledby="title">
        <sb-card-header>
          <sb-card-title id="title" role="heading" aria-level="1">Notification settings</sb-card-title>
          <sb-card-description>Choose how you want to hear from us.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <div class="switches">
            <sb-switch name="email" label="Email" description="Receive important account updates in your inbox." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Get instant alerts on your device."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of your activity, sent every Monday."></sb-switch>
          </div>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <p id="status" role="status"></p>
        </sb-card-footer>
      </form>
    </sb-card>
  </main>
  <script>
    document.getElementById('settings').addEventListener('submit', function (e) {
      e.preventDefault();
      var d = new FormData(e.target);
      var on = ['email', 'push', 'digest'].filter(function (k) { return d.has(k); });
      document.getElementById('status').textContent = 'Saved. ' + (on.length ? 'On: ' + on.join(', ') + '.' : 'All notifications off.');
    });
  </script>
</body>
</html>
