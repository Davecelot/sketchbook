<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css" />
  <!-- Classic IIFE bundle, not a module: module scripts are blocked on file:// -->
  <script src="sketchbook.js"></script>
  <style>
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--sb-space-6);
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-body);
      font-size: var(--sb-font-size-body);
    }
    main { width: 100%; max-width: 28rem; }
    .theme { display: flex; justify-content: flex-end; margin-block-end: var(--sb-space-4); }
    sb-card { width: 100%; }
    sb-card-footer { justify-content: space-between; gap: var(--sb-space-4); }
    #status { color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <main>
    <div class="theme">
      <sb-button id="theme-toggle" variant="outline" size="sm">Use dark theme</sb-button>
    </div>

    <form id="settings" aria-labelledby="settings-title">
      <sb-card>
        <sb-card-header>
          <sb-card-title id="settings-title" role="heading" aria-level="1">Notification settings</sb-card-title>
          <sb-card-description>Choose how we keep you up to date.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <sb-field-group>
            <sb-switch name="email" label="Email" description="Account activity and replies, sent to your inbox." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Instant alerts on devices where you're signed in."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday morning."></sb-switch>
          </sb-field-group>
        </sb-card-content>
        <sb-card-footer>
          <span id="status" role="status"></span>
          <sb-button type="submit">Save</sb-button>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const isDark = () =>
      root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const syncToggle = () => { toggle.textContent = isDark() ? 'Use light theme' : 'Use dark theme'; };
    syncToggle();
    toggle.addEventListener('click', () => {
      root.dataset.theme = isDark() ? 'light' : 'dark';
      syncToggle();
    });

    const form = document.getElementById('settings');
    const status = document.getElementById('status');
    const labels = { email: 'Email', push: 'Push', digest: 'Weekly digest' };
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const on = [...new FormData(form).keys()].map((key) => labels[key]);
      status.textContent = `Saved. On: ${on.length ? on.join(', ') : 'none'}.`;
    });
    form.addEventListener('change', () => { status.textContent = ''; });
  </script>
</body>
</html>
