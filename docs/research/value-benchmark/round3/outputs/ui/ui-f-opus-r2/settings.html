<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notification settings</title>
    <!-- Design-system tokens (copy of generated/css/tokens.css). Light/dark follow the OS unless <html data-theme> is set. -->
    <link rel="stylesheet" href="tokens.css" />
    <!-- Design-system components as a classic (non-module) script, so the page works from file://. -->
    <script src="sketchbook.js" defer></script>
    <style>
      html { color-scheme: light; }
      html[data-theme='dark'] { color-scheme: dark; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { color-scheme: dark; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: var(--sb-space-12) var(--sb-space-4);
        box-sizing: border-box;
        background: var(--sb-color-background);
        color: var(--sb-color-foreground);
        font-family: var(--sb-font-family-sans);
        font-size: var(--sb-font-size-sm);
        line-height: var(--sb-font-line-height-normal);
      }
      main { width: 100%; max-width: 28rem; }
      h1 { margin: 0; font: inherit; }
      .status { margin: 0; color: var(--sb-color-muted-foreground); min-height: 1lh; }
      /* Avoid a flash of unstyled custom elements before the script defines them. */
      :not(:defined) { visibility: hidden; }
    </style>
  </head>
  <body>
    <main>
      <form id="notification-settings" action="#" novalidate>
        <sb-card>
          <sb-card-header>
            <sb-card-title><h1>Notification settings</h1></sb-card-title>
            <sb-card-description>Choose how we keep you informed.</sb-card-description>
          </sb-card-header>
          <sb-card-content>
            <sb-field-group>
              <sb-checkbox
                name="email"
                label="Email"
                description="Get account activity and important updates by email."
                checked
              ></sb-checkbox>
              <sb-checkbox
                name="push"
                label="Push"
                description="Get instant alerts on your devices."
              ></sb-checkbox>
              <sb-checkbox
                name="weekly-digest"
                label="Weekly digest"
                description="A summary of the week's activity, every Monday."
              ></sb-checkbox>
            </sb-field-group>
          </sb-card-content>
          <sb-card-footer>
            <sb-button type="submit">Save</sb-button>
          </sb-card-footer>
        </sb-card>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      document.getElementById('notification-settings').addEventListener('submit', (event) => {
        event.preventDefault();
        // No backend here: send this FormData (only enabled settings are included) to persist it.
        const data = new FormData(event.currentTarget);
        console.info('Saved notification settings', Object.fromEntries(data));
        event.currentTarget.querySelector('.status').textContent = 'Settings saved.';
      });
    </script>
  </body>
</html>
