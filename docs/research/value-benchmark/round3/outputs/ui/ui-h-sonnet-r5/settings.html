<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 2rem 1rem;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-body);
    }
    sb-card { width: 100%; max-width: 28rem; }
    form { display: contents; }
    .settings { display: grid; gap: 1.5rem; }
    .status { margin: 0 0 0 0.75rem; font-size: 0.875rem; color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <sb-card>
    <form id="settings">
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-switch name="email" label="Email" description="Account activity and important updates, sent to your inbox." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Instant alerts on your phone or browser."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday morning."></sb-switch>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" role="status" id="status"></p>
      </sb-card-footer>
    </form>
  </sb-card>
  <script src="sketchbook.js"></script>
  <script>
    const form = document.getElementById('settings');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const on = [...new FormData(form).keys()];
      document.getElementById('status').textContent = on.length ? 'Saved. On: ' + on.join(', ') + '.' : 'Saved. All notifications are off.';
    });
  </script>
</body>
</html>
