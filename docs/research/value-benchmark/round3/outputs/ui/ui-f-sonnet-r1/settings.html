<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<!-- Design-system tokens (generated/css/tokens.css). Light/dark follows the OS via prefers-color-scheme. -->
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: var(--sb-space-6);
    background: var(--sb-color-background); color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
    font-size: var(--sb-font-size-body); line-height: var(--sb-font-line-height-body);
  }
  main { display: flex; justify-content: center; padding-top: var(--sb-space-6); }

  /* Card (mirrors sb-card) */
  .card {
    width: 100%; max-width: 28rem;
    display: flex; flex-direction: column; gap: var(--sb-card-gap); padding-block: var(--sb-card-padding);
    background: var(--sb-card-bg); color: var(--sb-card-fg);
    border: var(--sb-card-border-width) solid var(--sb-card-border);
    border-radius: var(--sb-card-radius); box-shadow: var(--sb-card-shadow);
  }
  .card > * { padding-inline: var(--sb-card-padding); }
  .card-header { display: grid; gap: var(--sb-card-header-gap); }
  h1 {
    margin: 0; font-size: var(--sb-card-title-font-size);
    font-weight: var(--sb-card-title-font-weight); line-height: var(--sb-card-title-line-height);
  }
  .card-header p { margin: 0; color: var(--sb-card-description-fg); }
  fieldset { border: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--sb-space-6); }
  legend {
    position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  /* Switch (mirrors sb-switch) */
  .setting {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    column-gap: var(--sb-switch-gap); row-gap: var(--sb-switch-content-gap); align-items: start;
  }
  .control {
    position: relative; display: inline-flex; grid-row: 1;
    margin-block: calc((var(--sb-switch-label-font-size) * var(--sb-switch-label-line-height) - var(--sb-switch-height)) / 2);
  }
  .control input {
    appearance: none; margin: 0; cursor: pointer;
    width: var(--sb-switch-width); height: var(--sb-switch-height);
    border: var(--sb-switch-border-width) solid var(--sb-switch-border);
    border-radius: var(--sb-switch-radius); background: var(--sb-switch-track-bg);
    box-shadow: var(--sb-switch-shadow);
    transition: background-color var(--sb-switch-transition-duration) var(--sb-switch-transition-easing),
                border-color var(--sb-switch-transition-duration) var(--sb-switch-transition-easing);
  }
  .control input:checked { background: var(--sb-switch-checked-bg); border-color: var(--sb-switch-checked-bg); }
  .control input:focus-visible {
    outline: none; border-color: var(--sb-switch-focus-ring-color);
    box-shadow: 0 0 0 var(--sb-switch-focus-ring-width) color-mix(in oklab, var(--sb-switch-focus-ring-color) 50%, transparent);
  }
  .thumb {
    position: absolute; pointer-events: none;
    top: calc((var(--sb-switch-height) - var(--sb-switch-thumb-size)) / 2);
    left: var(--sb-switch-inset);
    width: var(--sb-switch-thumb-size); height: var(--sb-switch-thumb-size);
    border-radius: var(--sb-switch-radius); background: var(--sb-switch-thumb-bg);
    transition: transform var(--sb-switch-transition-duration) var(--sb-switch-transition-easing);
  }
  input:checked ~ .thumb {
    transform: translateX(calc(var(--sb-switch-width) - var(--sb-switch-thumb-size) - 2 * var(--sb-switch-inset)));
    background: var(--sb-switch-thumb-checked-bg);
  }
  .setting label {
    grid-column: 2; grid-row: 1; cursor: pointer; color: var(--sb-switch-label-fg);
    font-size: var(--sb-switch-label-font-size); font-weight: var(--sb-switch-label-font-weight);
    line-height: var(--sb-switch-label-line-height);
  }
  .setting .desc {
    grid-column: 2; grid-row: 2; margin: 0; color: var(--sb-switch-description-fg);
    font-size: var(--sb-switch-description-font-size); line-height: var(--sb-switch-description-line-height);
  }

  /* Button (mirrors sb-button, default variant) */
  .card-footer { display: flex; align-items: center; gap: var(--sb-space-4); }
  button {
    height: var(--sb-button-height-default); padding-inline: var(--sb-button-padding-x-default);
    font: inherit; font-size: var(--sb-button-font-size); font-weight: var(--sb-button-font-weight);
    border: 0; border-radius: var(--sb-button-radius); cursor: pointer;
    background: var(--sb-button-default-bg); color: var(--sb-button-default-fg);
  }
  button:hover { background: color-mix(in oklab, var(--sb-button-default-bg) 90%, transparent); }
  button:focus-visible { outline: 2px solid var(--sb-button-focus-ring-color); outline-offset: 2px; }
  #status { margin: 0; color: var(--sb-color-muted-foreground); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (forced-colors: active) {
    .control input:checked { background: Highlight; border-color: Highlight; }
    .thumb { background: ButtonText; forced-color-adjust: none; }
  }
</style>
</head>
<body>
<main>
  <form class="card" id="form" aria-labelledby="title">
    <div class="card-header">
      <h1 id="title">Notification settings</h1>
      <p id="intro">Choose how you want to hear from us.</p>
    </div>

    <fieldset>
      <legend>Notification channels</legend>

      <div class="setting">
        <span class="control">
          <input type="checkbox" role="switch" id="email" name="email" checked aria-describedby="email-desc">
          <span class="thumb"></span>
        </span>
        <label for="email">Email</label>
        <p class="desc" id="email-desc">Receive updates and account activity in your inbox.</p>
      </div>

      <div class="setting">
        <span class="control">
          <input type="checkbox" role="switch" id="push" name="push" aria-describedby="push-desc">
          <span class="thumb"></span>
        </span>
        <label for="push">Push</label>
        <p class="desc" id="push-desc">Get instant alerts on your devices.</p>
      </div>

      <div class="setting">
        <span class="control">
          <input type="checkbox" role="switch" id="digest" name="digest" aria-describedby="digest-desc">
          <span class="thumb"></span>
        </span>
        <label for="digest">Weekly digest</label>
        <p class="desc" id="digest-desc">A summary of the week's activity, sent once every Monday.</p>
      </div>
    </fieldset>

    <div class="card-footer">
      <button type="submit">Save</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
</main>
<script>
  (function () {
    var form = document.getElementById('form'), status = document.getElementById('status');
    var KEYS = ['email', 'push', 'digest'], STORE = 'notification-settings';
    try {
      var saved = JSON.parse(localStorage.getItem(STORE));
      if (saved) KEYS.forEach(function (k) { form.elements[k].checked = !!saved[k]; });
    } catch (e) {}
    form.addEventListener('change', function () { status.textContent = ''; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = {};
      KEYS.forEach(function (k) { v[k] = form.elements[k].checked; });
      try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (err) {}
      status.textContent = 'Settings saved.';
    });
  })();
</script>
</body>
</html>
