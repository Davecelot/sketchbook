<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css">
  <script src="sketchbook.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: var(--sb-spacing-8, 32px) var(--sb-spacing-4, 16px);
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-sans);
    }
    sb-card { width: 100%; max-width: 440px; }
    form { display: contents; }
    .settings { display: grid; gap: var(--sb-spacing-6, 24px); }
    sb-card-footer { align-items: center; gap: var(--sb-spacing-3, 12px); }
    #status { font-size: var(--sb-font-size-sm); color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <main>
    <sb-card>
      <form id="settings" aria-labelledby="title">
        <sb-card-header>
          <sb-card-title id="title">Notification settings</sb-card-title>
          <sb-card-description>Choose how you want to hear from us.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <div class="settings">
            <sb-switch name="email" label="Email" description="Receive updates about your account by email." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Get alerts on your devices as they happen."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday."></sb-switch>
          </div>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <span id="status" role="status"></span>
        </sb-card-footer>
      </form>
    </sb-card>
  </main>
  <script>
    document.getElementById('settings').addEventListener('submit', (e) => {
      e.preventDefault();
      const on = [...new FormData(e.target).keys()];
      document.getElementById('status').textContent =
        on.length ? 'Saved. On: ' + on.join(', ') + '.' : 'Saved. All notifications off.';
    });
  </script>
</body>
</html>
