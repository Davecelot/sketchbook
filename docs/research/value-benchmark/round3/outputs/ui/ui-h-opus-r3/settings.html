<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notification settings</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="sketchbook.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--sb-space-6);
        box-sizing: border-box;
        background: var(--sb-color-background);
        color: var(--sb-color-foreground);
        font-family: var(--sb-font-family-body);
      }
      form {
        width: 100%;
        max-width: 28rem;
      }
      sb-card-footer {
        gap: var(--sb-space-3);
      }
      #status {
        color: var(--sb-color-muted-foreground);
        font-size: var(--sb-font-size-sm);
      }
    </style>
  </head>
  <body>
    <main>
      <form id="notification-settings" aria-labelledby="settings-title">
        <sb-card>
          <sb-card-header>
            <sb-card-title id="settings-title" role="heading" aria-level="1">Notification settings</sb-card-title>
            <sb-card-description>Choose how we keep you up to date.</sb-card-description>
          </sb-card-header>
          <sb-card-content>
            <sb-field-group>
              <sb-checkbox name="email" checked label="Email" description="Get account activity and updates in your inbox."></sb-checkbox>
              <sb-checkbox name="push" label="Push" description="Receive alerts on your devices as they happen."></sb-checkbox>
              <sb-checkbox name="digest" label="Weekly digest" description="A summary of the week, every Monday morning."></sb-checkbox>
            </sb-field-group>
          </sb-card-content>
          <sb-card-footer>
            <sb-button type="submit">Save</sb-button>
            <span id="status" role="status"></span>
          </sb-card-footer>
        </sb-card>
      </form>
    </main>
    <script>
      const form = document.getElementById('notification-settings');
      const status = document.getElementById('status');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const on = [...new FormData(form).keys()];
        status.textContent = on.length ? 'Settings saved.' : 'Settings saved. All notifications are off.';
      });
      form.addEventListener('change', () => (status.textContent = ''));
    </script>
  </body>
</html>
