<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-body);
    }
    sb-card { width: 100%; max-width: 420px; }
    form { display: contents; }
    .fields { display: flex; flex-direction: column; gap: 16px; }
    #status { margin: 0; font-size: 14px; color: var(--sb-color-muted-foreground); }
  </style>
</head>
<body>
  <sb-card>
    <form id="settings">
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="fields">
          <sb-checkbox name="email" label="Email" description="Receive important updates in your inbox." checked></sb-checkbox>
          <sb-checkbox name="push" label="Push" description="Get alerts on your device as they happen."></sb-checkbox>
          <sb-checkbox name="digest" label="Weekly digest" description="A summary of the week, every Monday."></sb-checkbox>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p id="status" role="status"></p>
      </sb-card-footer>
    </form>
  </sb-card>
  <script src="sketchbook.js"></script>
  <script>
    document.getElementById('settings').addEventListener('submit', (e) => {
      e.preventDefault();
      const on = [...new FormData(e.target).keys()];
      document.getElementById('status').textContent = 'Saved: ' + (on.length ? on.join(', ') : 'nothing enabled') + '.';
    });
  </script>
</body>
</html>
