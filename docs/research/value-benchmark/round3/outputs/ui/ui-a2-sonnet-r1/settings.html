<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  main { width: 100%; max-width: 28rem; }
  sb-card { display: block; }
  form { display: contents; }
  sb-card-header, sb-card-content, sb-card-footer { display: block; }
  sb-card-content { margin-top: 1.25rem; }
  sb-card-footer { margin-top: 1.5rem; display: flex; align-items: center; }
  .settings { display: flex; flex-direction: column; gap: 1.25rem; border: 0; margin: 0; padding: 0; min-width: 0; }
  .settings legend { padding: 0; }
  .status { margin: 0; font-size: .875rem; color: var(--sb-color-muted-foreground); }
  .theme { display: flex; justify-content: flex-end; margin-bottom: .75rem; }
</style>
</head>
<body>
<main>
  <div class="theme">
    <sb-button type="button" variant="outline" size="sm" id="theme">Dark theme</sb-button>
  </div>
  <form id="settings-form" aria-labelledby="title">
    <sb-card>
      <sb-card-header>
        <sb-card-title id="title">Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <fieldset class="settings">
          <legend class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Notification channels</legend>
          <sb-switch name="email" label="Email" description="Receive account updates and activity alerts by email." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
        </fieldset>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" id="status" role="status" aria-live="polite" style="margin-left:.75rem"></p>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
<script src="sketchbook.js"></script>
<script>
  var form = document.getElementById('settings-form');
  var statusEl = document.getElementById('status');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = new FormData(form);
    var on = ['email', 'push', 'digest'].filter(function (k) { return data.has(k); });
    statusEl.textContent = 'Saved. Enabled: ' + (on.length ? on.join(', ') : 'none') + '.';
  });
  form.addEventListener('change', function () { statusEl.textContent = ''; });

  var root = document.documentElement, btn = document.getElementById('theme');
  var dark = matchMedia('(prefers-color-scheme: dark)').matches;
  function apply() {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.textContent = dark ? 'Light theme' : 'Dark theme';
  }
  btn.addEventListener('click', function () { dark = !dark; apply(); });
  apply();
</script>
</body>
</html>
