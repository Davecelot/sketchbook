<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 48px 16px;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main { width: 100%; max-width: 440px; }
    h1 { margin: 0; font: inherit; }
    sb-card-content { display: grid; gap: 20px; }
    sb-card-footer { gap: 12px; }
    #status { font-size: 14px; color: var(--sb-color-muted-foreground); }
  </style>
  <script src="assets/sketchbook.js"></script>
</head>
<body>
  <main>
    <form id="settings" action="#">
      <sb-card>
        <sb-card-header>
          <sb-card-title><h1>Notification settings</h1></sb-card-title>
          <sb-card-description>Choose how you want to hear from us.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <sb-switch name="email" label="Email" description="Get important account updates in your inbox." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Receive alerts on your device as they happen."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week's activity, every Monday."></sb-switch>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <span id="status" role="status" aria-live="polite"></span>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>
  <script>
    var form = document.getElementById('settings');
    var statusEl = document.getElementById('status');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var d = new FormData(form);
      var on = ['email', 'push', 'digest'].filter(function (k) { return d.has(k); });
      statusEl.textContent = 'Saved. On: ' + (on.length ? on.join(', ') : 'none');
    });
    form.addEventListener('change', function () { statusEl.textContent = ''; });
  </script>
</body>
</html>
