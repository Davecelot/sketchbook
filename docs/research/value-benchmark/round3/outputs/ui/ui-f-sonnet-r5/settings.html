<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <!-- Design system tokens + prebuilt component bundle (classic scripts, so this works from file://). -->
  <link rel="stylesheet" href="assets/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main { width: 100%; max-width: 28rem; }
    form { display: contents; }
    .switches { display: flex; flex-direction: column; gap: 1.25rem; margin: 0; padding: 0; border: 0; min-width: 0; }
    .switches legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .status { margin: 0 0 0 0.75rem; font-size: 0.875rem; }
  </style>
  <script src="assets/sketchbook.js"></script>
</head>
<body>
  <main>
    <form id="settings" aria-labelledby="title">
      <sb-card>
        <sb-card-header>
          <sb-card-title id="title">Notification settings</sb-card-title>
          <sb-card-description>Choose how you want to hear from us.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <fieldset class="switches">
            <legend>Notification channels</legend>
            <sb-switch name="email" label="Email" description="Get account activity and updates in your inbox." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Receive instant alerts on your devices."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
          </fieldset>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <p class="status" role="status" id="status"></p>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>
  <script>
    document.getElementById('settings').addEventListener('submit', function (e) {
      e.preventDefault(); // no backend: stay on the page instead of navigating on file://
      var d = new FormData(e.target);
      var on = ['email', 'push', 'digest'].filter(function (k) { return d.has(k); });
      document.getElementById('status').textContent =
        'Saved. On: ' + (on.length ? on.join(', ') : 'none') + '.';
    });
  </script>
</body>
</html>
