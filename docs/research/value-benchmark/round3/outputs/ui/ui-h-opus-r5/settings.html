<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Notification settings</title>
  <link rel="stylesheet" href="tokens.css">
  <script src="sketchbook.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      place-items: start center;
      padding: var(--sb-space-16) var(--sb-space-4);
      background: var(--sb-color-background);
      color: var(--sb-color-foreground);
      font-family: var(--sb-font-family-sans);
    }
    main, form { width: min(100%, 28rem); }
    sb-card-footer { gap: var(--sb-space-3); }
    #status { color: var(--sb-color-muted-foreground); font-size: var(--sb-font-size-sm); }
  </style>
</head>
<body>
  <main>
    <form id="settings" aria-labelledby="settings-title">
      <sb-card>
        <sb-card-header>
          <sb-card-title id="settings-title" role="heading" aria-level="1">Notification settings</sb-card-title>
          <sb-card-description>Choose how we keep you informed.</sb-card-description>
        </sb-card-header>
        <sb-card-content>
          <sb-field-group>
            <sb-switch name="email" label="Email" description="Account activity and replies, sent to your inbox." checked></sb-switch>
            <sb-switch name="push" label="Push" description="Instant alerts on your devices."></sb-switch>
            <sb-switch name="digest" label="Weekly digest" description="A summary of the week, every Monday."></sb-switch>
          </sb-field-group>
        </sb-card-content>
        <sb-card-footer>
          <sb-button type="submit">Save</sb-button>
          <span id="status" role="status"></span>
        </sb-card-footer>
      </sb-card>
    </form>
  </main>
  <script>
    document.getElementById('settings').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const on = ['Email', 'Push', 'Weekly digest'].filter((_, i) => data.has(['email', 'push', 'digest'][i]));
      document.getElementById('status').textContent = on.length ? 'Saved. On: ' + on.join(', ') + '.' : 'Saved. All notifications off.';
    });
  </script>
</body>
</html>
