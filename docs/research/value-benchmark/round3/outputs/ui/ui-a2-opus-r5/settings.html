<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notification settings</title>
    <!-- Design-system tokens (light + dark). Copied from generated/css/tokens.css. -->
    <link rel="stylesheet" href="./tokens.css" />
    <!-- Design-system components as a classic IIFE bundle (works over file://). Copied from dist/sketchbook.js. -->
    <script src="./sketchbook.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--sb-space-inset-surface);
        box-sizing: border-box;
        background: var(--sb-color-background);
        color: var(--sb-color-foreground);
        font-family: var(--sb-font-family-body);
        font-size: var(--sb-font-size-body);
      }
      .page {
        width: 100%;
        max-width: 28rem;
        display: flex;
        flex-direction: column;
        gap: var(--sb-space-stack-md);
      }
      .toolbar {
        display: flex;
        justify-content: flex-end;
      }
      .settings {
        display: flex;
        flex-direction: column;
        gap: var(--sb-space-stack-loose);
      }
      .footer {
        display: flex;
        align-items: center;
        gap: var(--sb-space-stack-md);
      }
      .status {
        margin: 0;
        color: var(--sb-color-muted-foreground);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="toolbar">
        <sb-button id="theme-toggle" variant="outline" size="sm">Use dark theme</sb-button>
      </div>

      <form id="notification-form" aria-labelledby="notification-title">
        <sb-card>
          <sb-card-header>
            <sb-card-title id="notification-title" role="heading" aria-level="1">Notification settings</sb-card-title>
            <sb-card-description>Choose how we keep you up to date.</sb-card-description>
          </sb-card-header>

          <sb-card-content>
            <div class="settings">
              <sb-switch
                name="email"
                label="Email"
                description="Get account activity and updates in your inbox."
                checked
              ></sb-switch>
              <sb-separator></sb-separator>
              <sb-switch
                name="push"
                label="Push"
                description="Receive instant alerts on your devices."
              ></sb-switch>
              <sb-separator></sb-separator>
              <sb-switch
                name="weekly_digest"
                label="Weekly digest"
                description="A single summary of the week, sent every Monday."
              ></sb-switch>
            </div>
          </sb-card-content>

          <sb-card-footer>
            <div class="footer">
              <sb-button type="submit">Save</sb-button>
              <p id="status" class="status" role="status" aria-live="polite"></p>
            </div>
          </sb-card-footer>
        </sb-card>
      </form>
    </main>

    <script>
      // Save: read the form-associated switches through FormData.
      const form = document.getElementById('notification-form');
      const status = document.getElementById('status');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const on = ['email', 'push', 'weekly_digest'].filter((name) => data.has(name));
        const labels = { email: 'Email', push: 'Push', weekly_digest: 'Weekly digest' };
        status.textContent = on.length
          ? 'Saved. On: ' + on.map((n) => labels[n]).join(', ') + '.'
          : 'Saved. All notifications are off.';
      });
      form.addEventListener('change', () => {
        status.textContent = '';
      });

      // Theme: follows the system by default; the toggle pins light or dark via data-theme.
      const root = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
      const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : systemDark.matches);
      const render = () => {
        const dark = isDark();
        toggle.textContent = dark ? 'Use light theme' : 'Use dark theme';
        root.style.colorScheme = dark ? 'dark' : 'light';
      };
      toggle.addEventListener('click', () => {
        root.dataset.theme = isDark() ? 'light' : 'dark';
        render();
      });
      systemDark.addEventListener('change', render);
      render();
    </script>
  </body>
</html>
