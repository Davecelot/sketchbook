<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="../generated/css/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: var(--sb-color-background); color: var(--sb-color-foreground);
    font-family: ui-sans-serif, system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; }
  .settings { display: flex; flex-direction: column; gap: 20px; }
  .status { margin: 0; font-size: 14px; color: var(--sb-color-muted-foreground); }
  .theme { position: fixed; top: 16px; right: 16px; }
</style>
</head>
<body>
<div class="theme"><sb-button id="theme" type="button" variant="outline" size="sm" aria-pressed="false">Dark theme</sb-button></div>
<main>
  <form id="form">
    <sb-card>
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-switch name="email" label="Email" description="Receive account activity and updates by email." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Get instant alerts on your devices."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" id="status" role="status"></p>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
<script src="../dist/sketchbook.js"></script>
<script>
  var root = document.documentElement, btn = document.getElementById('theme');
  var dark = matchMedia('(prefers-color-scheme: dark)').matches;
  function apply() {
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.setAttribute('aria-pressed', String(dark));
    btn.textContent = dark ? 'Light theme' : 'Dark theme';
  }
  apply();
  btn.addEventListener('click', function () { dark = !dark; apply(); });
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var d = new FormData(e.target), on = [];
    ['email', 'push', 'digest'].forEach(function (k) { if (d.has(k)) on.push(k); });
    document.getElementById('status').textContent = 'Saved. On: ' + (on.join(', ') || 'none') + '.';
  });
</script>
</body>
</html>
