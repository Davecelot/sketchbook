<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notification settings</title>
    <link rel="stylesheet" href="vendor/tokens.css" />
    <!-- Design-system bundle (IIFE, classic script so it loads from file://). Registers every sb-* element. -->
    <script src="vendor/sketchbook.js" defer></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: var(--sb-size-48) var(--sb-size-16);
        box-sizing: border-box;
        background: var(--sb-color-background);
        color: var(--sb-color-foreground);
        font-family: var(--sb-font-family-body);
        font-size: var(--sb-font-size-body);
        line-height: var(--sb-font-line-height-body);
      }
      main {
        width: 100%;
        max-width: 28rem;
      }
      sb-card-footer {
        justify-content: flex-end;
        gap: var(--sb-size-12);
      }
      #status {
        margin: 0 auto 0 0;
        color: var(--sb-color-muted-foreground);
        font-size: var(--sb-font-size-caption);
      }
      /* Hide elements until the bundle defines them, so nothing flashes unstyled. */
      :not(:defined) {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <form id="notification-settings" aria-labelledby="settings-title">
        <sb-card>
          <sb-card-header>
            <sb-card-title id="settings-title" role="heading" aria-level="1">Notification settings</sb-card-title>
            <sb-card-description>Choose how we keep you informed.</sb-card-description>
          </sb-card-header>
          <sb-card-content>
            <sb-field-group>
              <sb-checkbox
                name="email"
                label="Email"
                description="Account activity and important updates sent to your inbox."
                checked
              ></sb-checkbox>
              <sb-checkbox
                name="push"
                label="Push"
                description="Instant alerts on devices where you're signed in."
              ></sb-checkbox>
              <sb-checkbox
                name="weekly-digest"
                label="Weekly digest"
                description="One summary of the week's activity, every Monday."
              ></sb-checkbox>
            </sb-field-group>
          </sb-card-content>
          <sb-card-footer>
            <p id="status" role="status" aria-live="polite"></p>
            <sb-button type="submit">Save</sb-button>
          </sb-card-footer>
        </sb-card>
      </form>
    </main>
    <script>
      document.getElementById('notification-settings').addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const on = ['email', 'push', 'weekly-digest'].filter((n) => data.has(n));
        const labels = { email: 'Email', push: 'Push', 'weekly-digest': 'Weekly digest' };
        document.getElementById('status').textContent = on.length
          ? 'Saved. On: ' + on.map((n) => labels[n]).join(', ') + '.'
          : 'Saved. All notifications are off.';
      });
    </script>
  </body>
</html>
