<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: start center;
    padding: 48px 16px;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: system-ui, sans-serif;
  }
  sb-card { width: 100%; max-width: 440px; }
  form { display: contents; }
  .options { display: grid; gap: 20px; }
  #status { margin: 0; font-size: 14px; color: var(--sb-color-muted-foreground); }
</style>
<script src="sketchbook.js"></script>
</head>
<body>
<main>
<form id="settings">
  <sb-card>
    <sb-card-header>
      <sb-card-title>Notification settings</sb-card-title>
      <sb-card-description>Choose how you want to hear from us.</sb-card-description>
    </sb-card-header>
    <sb-card-content>
      <div class="options">
        <sb-checkbox name="email" label="Email" description="Account activity and important updates in your inbox." checked></sb-checkbox>
        <sb-checkbox name="push" label="Push" description="Instant alerts on your phone or browser."></sb-checkbox>
        <sb-checkbox name="digest" label="Weekly digest" description="One summary email every Monday."></sb-checkbox>
      </div>
    </sb-card-content>
    <sb-card-footer>
      <sb-button type="submit">Save</sb-button>
      <p id="status" role="status"></p>
    </sb-card-footer>
  </sb-card>
</form>
</main>
<script>
  document.getElementById('settings').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = new FormData(e.target);
    const on = ['email', 'push', 'digest'].filter((k) => data.has(k));
    document.getElementById('status').textContent = 'Saved. On: ' + (on.join(', ') || 'none') + '.';
  });
</script>
</body>
</html>
