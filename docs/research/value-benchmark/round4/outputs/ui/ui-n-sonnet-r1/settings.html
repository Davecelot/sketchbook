<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: var(--sb-color-background); color: var(--sb-color-foreground); font-family: system-ui, sans-serif; }

  .settings { display: flex; flex-direction: column; gap: 1.25rem; }

<body>
<form id="settings" action="#">
  <sb-card>
    <sb-card-header>
      <sb-card-title>Notification settings</sb-card-title>
      <sb-card-description>Choose how you want to hear from us.</sb-card-description>
    </sb-card-header>
    <sb-card-content>
      <div class="settings">
        <sb-switch name="email" label="Email" description="Account activity and receipts, sent to your inbox." checked></sb-switch>
        <sb-switch name="push" label="Push" description="Instant alerts on this device."></sb-switch>
        <sb-switch name="digest" label="Weekly digest" description="One summary email every Monday."></sb-switch>
      </div>
    </sb-card-content>
    <sb-card-footer>
      <sb-button type="submit">Save</sb-button>
      <span id="status" role="status"></span>
    </sb-card-footer>
  </sb-card>
</form>

    new FormData(e.target).forEach(function (_, k) { on.push(k); });
    document.getElementById('status').textContent = 'Saved. On: ' + (on.join(', ') || 'none') + '.';
  });
</script>
</body>
</html>
