<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notification settings</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1rem;
    box-sizing: border-box;
    background: var(--sb-color-background);
    color: var(--sb-color-foreground);
    font-family: var(--sb-font-family-body);
  }
  sb-card { width: min(100%, 28rem); }
  .settings { display: grid; gap: 1.5rem; }
  .status { margin: 0 0 0 1rem; font-size: 0.875rem; color: var(--sb-color-muted-foreground); }
</style>
</head>
<body>
<main>
  <form id="settings">
    <sb-card>
      <sb-card-header>
        <sb-card-title>Notification settings</sb-card-title>
        <sb-card-description>Choose how you want to hear from us.</sb-card-description>
      </sb-card-header>
      <sb-card-content>
        <div class="settings">
          <sb-switch name="email" label="Email" description="Receive updates about your account by email." checked></sb-switch>
          <sb-switch name="push" label="Push" description="Get alerts on your devices as things happen."></sb-switch>
          <sb-switch name="digest" label="Weekly digest" description="A summary of the week, sent every Monday."></sb-switch>
        </div>
      </sb-card-content>
      <sb-card-footer>
        <sb-button type="submit">Save</sb-button>
        <p class="status" role="status" id="status"></p>
      </sb-card-footer>
    </sb-card>
  </form>
</main>
<script src="sketchbook.js"></script>
<script>
  document.getElementById('settings').addEventListener('submit', function (e) {
    e.preventDefault();
    var on = Array.from(new FormData(e.target).keys());
    document.getElementById('status').textContent =
      'Saved. On: ' + (on.length ? on.join(', ') : 'none') + '.';
  });
</script>
</body>
</html>
