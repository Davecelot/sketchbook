<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notification settings</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="sketchbook.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: var(--sb-space-4);
        padding: var(--sb-space-6);
        box-sizing: border-box;
        background: var(--sb-color-background);
        color: var(--sb-color-foreground);
        font-family: var(--sb-font-family-body);
        font-size: var(--sb-font-size-body);
      }
      main {
        width: 100%;
        max-width: 28rem;
        display: grid;
        gap: var(--sb-space-4);
      }
      .theme {
        justify-self: end;
      }
      sb-card-title h1 {
        margin: 0;
        font: inherit;
      }
      form sb-card-content {
        display: grid;
        gap: var(--sb-space-6);
      }
      form sb-card-footer {
        display: flex;
        align-items: center;
        gap: var(--sb-space-3);
      }
      #status {
        margin: 0;
        color: var(--sb-color-muted-foreground);
      }
    </style>
  </head>
  <body>
    <main>
      <sb-button class="theme" id="theme" variant="outline" size="sm" aria-pressed="false">Dark theme</sb-button>

      <form id="settings">
        <sb-card>
          <sb-card-header>
            <sb-card-title><h1>Notification settings</h1></sb-card-title>
            <sb-card-description>Choose how we keep you informed.</sb-card-description>
          </sb-card-header>
          <sb-card-content>
            <sb-switch
              name="email"
              label="Email"
              description="Get account and activity updates by email."
              checked
            ></sb-switch>
            <sb-switch
              name="push"
              label="Push"
              description="Receive alerts on your devices in real time."
            ></sb-switch>
            <sb-switch
              name="digest"
              label="Weekly digest"
              description="A summary of the week, every Monday morning."
            ></sb-switch>
          </sb-card-content>
          <sb-card-footer>
            <sb-button type="submit">Save</sb-button>
            <p id="status" role="status"></p>
          </sb-card-footer>
        </sb-card>
      </form>
    </main>

    <script>
      const root = document.documentElement;
      const themeButton = document.getElementById('theme');
      const setTheme = (dark) => {
        root.dataset.theme = dark ? 'dark' : 'light';
        themeButton.setAttribute('aria-pressed', String(dark));
      };
      setTheme(matchMedia('(prefers-color-scheme: dark)').matches);
      themeButton.addEventListener('click', () => setTheme(root.dataset.theme !== 'dark'));

      const form = document.getElementById('settings');
      const status = document.getElementById('status');
      const labels = { email: 'Email', push: 'Push', digest: 'Weekly digest' };
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const on = [...new FormData(form).keys()].map((key) => labels[key]);
        status.textContent = `Saved. On: ${on.length ? on.join(', ') : 'none'}.`;
      });
      form.addEventListener('change', () => (status.textContent = ''));
    </script>
  </body>
</html>
