<!-- Demo: The search icon sits in an add-on next to the input. The input keeps Search as its accessible name without showing a separate label. -->
<sb-input-group style="max-width:24rem">
  <sb-input hide-label label="Search" placeholder="Search..."></sb-input>
  <sb-input-group-addon>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
  </sb-input-group-addon>
</sb-input-group>
