<svg viewBox="0 0 720 240" role="img" aria-label="Three token layers stacked: a component token points to a semantic token, which points to a foundation value. Each step goes down one layer only.">
<defs><filter id="sketch-layers" x="-3%" y="-5%" width="106%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter><marker id="arrow-layers" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>
<g filter="url(#sketch-layers)" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<rect x="180" y="20" width="360" height="52" rx="8"/>
<rect x="180" y="94" width="360" height="52" rx="8"/>
<rect x="180" y="168" width="360" height="52" rx="8" stroke="var(--sb-color-primary)" stroke-width="2"/>
<path d="M360 74 L360 88" marker-end="url(#arrow-layers)"/>
<path d="M360 148 L360 162" marker-end="url(#arrow-layers)"/>
</g>
<g font-family="inherit" text-anchor="middle">
<text x="360" y="45" font-size="16" fill="var(--sb-color-foreground)">Component  <tspan fill="var(--sb-color-muted-foreground)" font-size="13">button.background</tspan></text>
<text x="360" y="119" font-size="16" fill="var(--sb-color-foreground)">Semantic  <tspan fill="var(--sb-color-muted-foreground)" font-size="13">color.primary</tspan></text>
<text x="360" y="193" font-size="16" fill="var(--sb-color-primary)">Foundation  <tspan fill="var(--sb-color-muted-foreground)" font-size="13">color.brand.600</tspan></text>
</g>
<g font-family="inherit" font-size="13" fill="var(--sb-color-muted-foreground)">
<text x="24" y="45">used by</text>
<text x="24" y="119">points to</text>
<text x="24" y="193">generated from</text>
</g>
<text x="576" y="119" font-family="inherit" font-size="13" fill="var(--sb-color-muted-foreground)">one step only</text>
</svg>
